<style>
:root{
  --ink:#1d1b16; --sub:#4f4a40; --cream:#f3efe6; --chip:#efe9dc; --white:#fff; --line:#e2dccf;
  --tomato:#e4572e; --butter:#f3c74f; --sky:#8cc0ea; --sage:#b9d6a5; --warn:#fbe7a6;
  --n-bg:#0d100d; --n-fg:#c9d3bf; --n-sub:#8f9c84; --n-card:#151915;

  --suma:#172029; --suma-fg:#b9cde0; --suma-sub:#8aa1b6;
  --neu:#1a1c1a; --neu-fg:#b8beb2; --neu-sub:#8b9186;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Figtree,-apple-system,system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body.noche{background:var(--n-bg);color:var(--n-fg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
.G{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:700;letter-spacing:-0.02em}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.wrap{padding:calc(var(--safe-t) + 18px) 14px calc(var(--safe-b) + 110px);display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 8px 6px;gap:10px}
.h1{font-size:40px;line-height:1;letter-spacing:-0.03em}
.h3{font-size:21px}
.small{font-size:13px;line-height:1.45;color:var(--sub)}
.muted{color:var(--sub)}
.card{background:var(--white);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.sky{background:var(--sky)} .card.tomato{background:var(--tomato);color:#1a0f0a} .card.butter{background:var(--butter)} .card.sage{background:var(--sage)} .card.warn{background:var(--warn)} .card.ink{background:var(--ink);color:var(--cream)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;background:var(--chip);font-size:15px;min-height:42px}
.chip.on{background:var(--ink);color:var(--cream)}
.card.sage .chip{background:var(--white)} .card.sage .chip.on{background:var(--ink)}
.dot{width:8px;height:8px;border-radius:4px;background:var(--tomato);display:inline-block}
.seg{display:grid;gap:8px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.seg button{padding:12px 4px;border-radius:16px;background:var(--chip);font-size:15px;min-height:46px}
.seg button.on{background:var(--ink);color:var(--cream);font-weight:600}
.card.tomato .seg button{background:rgba(26,15,10,.15)}
.btn{height:56px;border-radius:20px;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;width:100%;padding:0 16px}
.btn.light{background:var(--white);color:var(--ink)} .btn.chipc{background:var(--chip);color:var(--ink)} .btn.danger{background:#f6d7cc;color:#7a2210}
.btn.small{height:44px;font-size:15px;border-radius:16px;width:auto}
.tiles{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px}
.tile{border-radius:18px;background:var(--chip);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-size:26px} .tile .l{font-size:12px}
.bar{height:12px;border-radius:6px;background:rgba(29,27,22,.12);overflow:hidden}
.bar>i{display:block;height:12px;border-radius:6px;background:var(--ink)}
.list .it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--chip);font-size:15px;align-items:center}
.list .it:last-child{border-bottom:none}
input.f,select.f,textarea.f{width:100%;min-height:50px;border-radius:16px;border:none;background:var(--chip);padding:0 14px;font-size:17px}
textarea.f{padding:12px 14px;min-height:90px;resize:none}
.card.sage input.f{background:var(--white)}
label.lab{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub)}
.tm{border-radius:18px;background:var(--chip);padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub)}
.tm input{border:none;background:transparent;font-size:22px;font-weight:600;color:var(--ink);padding:0;min-height:30px;width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b);z-index:20}

.back{font-size:15px;font-weight:600;padding:8px 0}

/* Pantalla de crisis (noche) */
.n-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:10px;padding:calc(var(--safe-t) + 16px) 14px calc(var(--safe-b) + 16px)}

.tilebtn .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-0.03em;line-height:1}
.tilebtn .s{font-size:15px}
.tilebtn:disabled{opacity:.45}
.t-laura{background:var(--laura);color:var(--laura-fg)} .t-laura .s{color:var(--laura-sub)}
.t-dolor{background:var(--dolor);color:var(--dolor-fg)} .t-dolor .s{color:var(--dolor-sub)}
.t-suma{background:var(--suma);color:var(--suma-fg)} .t-suma .s{color:var(--suma-sub)}
.t-neu{background:var(--neu);color:var(--neu-fg)} .t-neu .s{color:var(--neu-sub)}
.n-status{padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px}
.n-status .k{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.n-status .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:64px;line-height:1;color:#dfe6d6;letter-spacing:-0.03em}
.n-card{border-radius:28px;background:var(--n-card);padding:18px;display:flex;flex-direction:column;gap:12px}
.n-btn{height:56px;border-radius:22px;background:var(--n-card);color:#b7c7a8;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;width:100%}
.n-small{font-size:13px;color:var(--n-sub)}
.n-seg{display:grid;gap:8px}
.n-seg button{height:56px;border-radius:18px;background:#1f241e;color:var(--neu-fg);font-size:16px;font-weight:600}
.n-seg button.on{background:var(--dolor);color:var(--dolor-fg)}
.n-link{color:#b7c7a8;font-size:14px;padding:8px}
.hidden{display:none!important}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   LAURA · app personal de Sena para la cefalea en racimos
   Todo se guarda primero en el móvil (funciona sin internet)
   y se copia a su nube de Firebase cuando hay conexión.
   ========================================================= */
const APP_VER = '1.0';
const KEY_DB = 'laura-db', KEY_SYNC = 'laura-nube';
const COLS = ['eventos', 'efectos', 'comidas', 'tomas', 'meds', 'tandas', 'dias', 'suenos', 'citas', 'pruebas', 'cfg'];
const MIN = 60000, HORA = 3600000, DIA = 86400000;

/* ---------------- Utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const now = () => Date.now();
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const pad = n => ('0' + n).slice(-2);
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const lista = l => l.length <= 1 ? (l[0] || '') : l.slice(0, -1).join(', ') + ' y ' + l[l.length - 1];

/* ---------------- Horas y zonas horarias ----------------
   Cada registro guarda el instante (ms) y la zona donde estabas.
   «Hora de casa» = zona de Ajustes (Madrid por defecto). */
const tzHere = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Madrid'; } catch (e) { return 'Europe/Madrid'; } };
const fmtCache = {};
function partes(ms, tz) {
  const k = tz || 'local';
  if (!fmtCache[k]) fmtCache[k] = new Intl.DateTimeFormat('en-GB', { timeZone: tz || undefined, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', weekday: 'short' });
  const o = {}; fmtCache[k].formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value);
  return { y: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, wd: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(o.weekday) };
}
const dayKey = (ms, tz) => { const p = partes(ms, tz); return p.y + '-' + pad(p.m) + '-' + pad(p.d); };
const hhmm = (ms, tz) => { const p = partes(ms, tz); return pad(p.h) + ':' + pad(p.mi); };
function offsetMin(ms, tz) { const p = partes(ms, tz); return Math.round((Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi) - Math.floor(ms / MIN) * MIN) / MIN); }
function epochDe(day, hm, tz) {
  const [y, m, d] = day.split('-').map(Number), [h, mi] = (hm || '00:00').split(':').map(Number);
  const guess = Date.UTC(y, m - 1, d, h, mi);
  let t = guess - offsetMin(guess, tz) * MIN;
  t = guess - offsetMin(t, tz) * MIN;
  return t;
}
const sumarDias = (day, n) => { const [y, m, d] = day.split('-').map(Number); const x = new Date(Date.UTC(y, m - 1, d + n)); return x.getUTCFullYear() + '-' + pad(x.getUTCMonth() + 1) + '-' + pad(x.getUTCDate()); };
const DIAS_L = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function fechaLarga(day) { const [y, m, d] = day.split('-').map(Number); const wd = (new Date(Date.UTC(y, m - 1, d)).getUTCDay() + 6) % 7; return cap(DIAS_L[wd]) + ' ' + d + ' de ' + MESES[m - 1]; }
function fechaCorta(day) { const [y, m, d] = day.split('-').map(Number); return d + ' ' + MESES[m - 1].slice(0, 3); }
function cuandoDia(day) { const hoy = dayKey(now()); if (day === hoy) return 'Hoy'; if (day === sumarDias(hoy, -1)) return 'Ayer'; return fechaLarga(day); }
const homeTz = () => (CFG().homeTz || 'Europe/Madrid');
const lejos = () => offsetMin(now(), tzHere()) !== offsetMin(now(), homeTz());
const ciudad = tz => (tz || '').split('/').pop().replace(/_/g, ' ');
function difHoras() { const d = (offsetMin(now(), tzHere()) - offsetMin(now(), homeTz())) / 60; return (d > 0 ? '+' : '−') + Math.abs(d) + ' h'; }
function durTxt(ms) { const m = Math.max(0, Math.round(ms / MIN)); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return h + ' h' + (r ? ' ' + pad(r) : ''); }
function haceTxt(ms) { const m = Math.round((now() - ms) / MIN); if (m < 1) return 'ahora'; if (m < 60) return 'hace ' + m + ' min'; const h = Math.round(m / 60); if (h < 36) return 'hace ' + h + ' h'; return 'hace ' + Math.round(h / 24) + ' días'; }

/* ---------------- Base de datos local ---------------- */
let DB = (() => { try { return JSON.parse(localStorage.getItem(KEY_DB)) || {}; } catch (e) { return {}; } })();
COLS.forEach(c => { if (!Array.isArray(DB[c])) DB[c] = []; });
function guardar() { try { localStorage.setItem(KEY_DB, JSON.stringify(DB)); } catch (e) { toast('No queda espacio en el móvil para guardar'); } }
const vivos = c => DB[c].filter(r => !r.borrado);
const porId = (c, id) => DB[c].find(r => r.id === id);
function poner(col, rec) {
  rec.upd = now();
  if (!rec.id) rec.id = uid();
  const i = DB[col].findIndex(r => r.id === rec.id);
  if (i < 0) DB[col].push(rec); else DB[col][i] = rec;
  guardar(); SYNC.marcar(col, rec.id); planCambiado();
  return rec;
}
function borrar(col, id) { const r = porId(col, id); if (!r) return; r.borrado = true; poner(col, r); }

/* ---------------- Ajustes ---------------- */
const CFG_DEF = { id: 'cfg', lado: 'der', margen: 15, ronca: '', tabaco: 'diario', cig: '', homeTz: 'Europe/Madrid', tomasHora: 'casa', plumas: 0, avisoPlumas: 3, vigilados: ['alcohol', 'embutido', 'queso curado'], diasCrisis: 0 };
function CFG() { const c = DB.cfg.find(r => r.id === 'cfg'); return Object.assign({}, CFG_DEF, c || {}); }
function setCfg(cambios) { const c = Object.assign(CFG(), cambios); poner('cfg', c); }

/* ---------------- Crisis (eventos) ----------------
   Un evento junta: Laura (síntomas premonitorios) → dolor → pinchazos → fin. */
const abierto = () => vivos('eventos').filter(e => !e.fin && !e.pasado).sort((a, b) => inicioEv(b) - inicioEv(a))[0] || null;
const inicioEv = e => Math.min(...[e.laura, e.dolor, (e.pinchazos || [])[0]].filter(Boolean).concat([e.creado || now()]));
const esCrisis = e => !!(e.dolor || (e.pinchazos || []).length);
const pinchazos24 = () => { const t = now() - DIA; let n = 0; vivos('eventos').forEach(e => (e.pinchazos || []).forEach(p => { if (p > t) n++; })); return n; };
const ultimoPinchazo = () => { let m = 0; vivos('eventos').forEach(e => (e.pinchazos || []).forEach(p => { if (p > m) m = p; })); return m; };
function puedePinchar() {
  const n = pinchazos24(), u = ultimoPinchazo();
  if (n >= 2) { const lista24 = []; vivos('eventos').forEach(e => (e.pinchazos || []).forEach(p => { if (p > now() - DIA) lista24.push(p); })); lista24.sort(); return { ok: false, desde: lista24[0] + DIA, n }; }
  if (u && now() - u < HORA) return { ok: false, desde: u + HORA, n };
  return { ok: true, n };
}
function durmiendoAhora() { const s = vivos('suenos').filter(x => x.dormir && !x.despertar).sort((a, b) => b.dormir - a.dormir)[0]; return s && now() - s.dormir < 16 * HORA ? s : null; }
function ultimaCrisis() { let m = 0; vivos('eventos').forEach(e => { if (esCrisis(e)) { const t = e.dolor || (e.pinchazos || [])[0]; if (t > m) m = t; } }); return m; }
function diasSinDolor() { const u = ultimaCrisis(); if (!u) return null; return Math.floor((now() - u) / DIA); }
function rachaMaxima() {
  const l = vivos('eventos').filter(esCrisis).map(e => e.dolor || e.pinchazos[0]).sort((a, b) => a - b);
  let m = 0; for (let i = 1; i < l.length; i++) m = Math.max(m, Math.floor((l[i] - l[i - 1]) / DIA));
  if (l.length) m = Math.max(m, Math.floor((now() - l[l.length - 1]) / DIA));
  return m;
}
function diasConSumaMes(tz) {
  const mes = dayKey(now(), tz).slice(0, 7), s = new Set();
  vivos('eventos').forEach(e => (e.pinchazos || []).forEach(p => { const d = dayKey(p, tz); if (d.startsWith(mes)) s.add(d); }));
  return s.size;
}

/* ---------------- Medicación ---------------- */
const preventivos = () => vivos('meds').filter(m => m.tipo === 'preventivo' && m.activo !== false);
const suplementos = () => vivos('meds').filter(m => m.tipo === 'suplemento' && m.activo !== false);
function tzTomas() { return CFG().tomasHora === 'local' ? tzHere() : homeTz(); }
function tandaActiva(day) { return vivos('tandas').find(t => { const p = pautaTanda(t); return p.length && day >= p[0].dia && day <= p[p.length - 1].dia; }); }
function pautaTanda(t) {
  const out = []; let dosis = Number(t.dosisIni) || 0; const baja = Number(t.bajada) || 0, cada = Math.max(1, Number(t.cada) || 1), fin = Number(t.dosisFin) || 0;
  let day = t.inicio, i = 0;
  if (!day || !dosis) return out;
  while (dosis > 0 && i < 120) {
    for (let k = 0; k < cada && i < 120; k++, i++) { out.push({ dia: day, dosis }); day = sumarDias(day, 1); }
    if (!baja) break;
    dosis = Math.round((dosis - baja) * 100) / 100;
    if (dosis < fin) break;
  }
  return out;
}
/* Tomas programadas de un día: [{slot, hora, meds:[{id,nombre,dosis}]}] */
function tomasDelDia(day) {
  const porHora = {};
  preventivos().forEach(m => {
    if (m.desde && day < m.desde) return;
    (m.horas || []).forEach(h => { (porHora[h] = porHora[h] || []).push({ id: m.id, nombre: m.nombre, dosis: m.dosis }); });
  });
  const t = tandaActiva(day);
  if (t) { const p = pautaTanda(t).find(x => x.dia === day); if (p) { const h = t.hora || '09:00'; (porHora[h] = porHora[h] || []).push({ id: 'tanda:' + t.id, nombre: t.nombre || 'Corticoide', dosis: p.dosis + ' mg' }); } }
  return Object.keys(porHora).sort().map(h => ({ day, hora: h, meds: porHora[h], t: epochDe(day, h, tzTomas()) }));
}
const slotId = (day, hora, medId) => day + '|' + hora + '|' + medId;
const tomaDe = (day, hora, medId) => vivos('tomas').find(t => t.slot === slotId(day, hora, medId));
function pendientesAhora() {
  const tz = tzTomas(), hoy = dayKey(now(), tz), out = [];
  [sumarDias(hoy, -1), hoy, sumarDias(hoy, 1)].forEach(d => tomasDelDia(d).forEach(s => {
    const meds = s.meds.filter(m => !tomaDe(d, s.hora, m.id));
    if (meds.length) out.push(Object.assign({}, s, { meds }));
  }));
  // Lo que toca: lo atrasado de las últimas 6 h y lo de las próximas 18 h
  return out.filter(s => s.t > now() - 6 * HORA && s.t < now() + 18 * HORA).sort((a, b) => a.t - b.t);
}
function adherencia(medId, dias) {
  const tz = tzTomas(), hoy = dayKey(now(), tz); let prog = 0, ok = 0, tarde = 0; const tira = [];
  const m = porId('meds', medId);
  for (let i = dias - 1; i >= 0; i--) {
    const d = sumarDias(hoy, -i); let p = 0, o = 0, t = 0;

  }
  return { prog, ok, tarde, tira };
}

   7 días y lo deja en la nube. La hoja de Google lo mira cada
   minuto y manda el aviso al iPhone cuando llega la hora.
   ========================================================= */
function calcularPlan() {
  const tz = tzTomas(), hoy = dayKey(now(), tz), avisos = [];
  const casa = tz === homeTz() && lejos();
  for (let i = -1; i < 7; i++) {
    const d = sumarDias(hoy, i);
    tomasDelDia(d).forEach(s => {
      const meds = s.meds.filter(m => !tomaDe(d, s.hora, m.id));
      if (!meds.length || s.t < now() - 45 * MIN) return;
      avisos.push({ id: 'toma|' + d + '|' + s.hora, t: s.t, rep: 3, cada: 15, abrir: 'hoy',
        titulo: 'Te toca: ' + lista(meds.map(m => m.nombre)),
        texto: (meds.map(m => m.dosis).filter(Boolean).length ? lista(meds.map(m => m.nombre + (m.dosis ? ' ' + m.dosis : ''))) + ' · ' : '') + s.hora + (casa ? ' hora de casa' : '') + '. Toca para marcarla.' });
    });
  }
  // A los 15 minutos de un pinchazo: ¿cómo estás?
  const e = abierto();
  if (e && (e.pinchazos || []).length && !e.resp15) {
    const p = e.pinchazos[e.pinchazos.length - 1];
    avisos.push({ id: 'p15|' + p, t: p + 15 * MIN, rep: 1, cada: 0, abrir: 'inicio', titulo: '¿Cómo estás?', texto: 'Han pasado 15 minutos del pinchazo. Toca para contestar.' });
  }
  // Cita: la tarde de antes
  vivos('citas').forEach(c => {
    if (!c.t || c.t < now()) return;
    const dia = dayKey(c.t, tzHere()), t = epochDe(sumarDias(dia, -1), '20:00', tzHere());
    if (t > now() - HORA) avisos.push({ id: 'cita|' + c.id + '|' + c.t, t, rep: 1, cada: 0, abrir: 'consulta', titulo: 'Mañana: ' + (c.tipo || 'Neurología'), texto: 'A las ' + hhmm(c.t, tzHere()) + (c.lugar ? ' · ' + c.lugar : '') + '. Tienes ' + plural((c.preguntas || []).filter(q => !q.hecho).length, 'pregunta apuntada', 'preguntas apuntadas') + '.' });
  });
  // Pocas plumas
  const c = CFG();
  if (c.plumas > 0 && c.plumas <= (c.avisoPlumas || 3)) avisos.push({ id: 'plumas|' + c.plumas, t: now(), rep: 1, cada: 0, abrir: 'medicinas', titulo: 'Quedan ' + plural(c.plumas, 'pluma', 'plumas') + ' de sumatriptán', texto: 'Acuérdate de pedir la receta.' });
  return { v: 1, gen: now(), avisos: avisos.sort((a, b) => a.t - b.t).slice(0, 80) };
}

/* ---------------- Hoy ---------------- */
const CHIPS_DIA = ['Bolo', 'Vuelo', 'Dormí fuera', 'Siesta', 'Alcohol', 'Fumé más de lo normal', 'Estrés'];
function diaRec(day) { return vivos('dias').find(d => d.id === day) || { id: day }; }
function setDia(day, cambios) { const d = Object.assign({}, diaRec(day), cambios); delete d.borrado; poner('dias', d); }
function ultimoSueno() { return vivos('suenos').filter(s => s.dormir && now() - s.dormir < 20 * HORA).sort((a, b) => b.dormir - a.dormir)[0] || null; }
function suenoHabitual() {
  const l = vivos('suenos').filter(s => s.dormir && s.despertar).slice(-14);
  if (!l.length) return { dormir: '00:30', despertar: '08:30' };
  const med = arr => { const v = arr.map(x => { const p = partes(x); let m = p.h * 60 + p.mi; if (m < 12 * 60) m += 1440; return m; }).sort((a, b) => a - b); const m = v[Math.floor(v.length / 2)] % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  const med2 = arr => { const v = arr.map(x => { const p = partes(x); return p.h * 60 + p.mi; }).sort((a, b) => a - b); const m = v[Math.floor(v.length / 2)]; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  return { dormir: med(l.map(s => s.dormir)), despertar: med2(l.map(s => s.despertar)) };
}
function pHoy() {

  // Sin dolor
  const ds = diasSinDolor();
  if (ds === null) out += `<div class="card sky"><span style="font-size:14px;font-weight:600">Sin crisis apuntadas todavía</span><span style="font-size:14px">Cuando apuntes la primera, aquí verás los días que llevas sin dolor.</span></div>`;
  else { const pct = Math.min(100, Math.round(ds / 90 * 100)); const f3 = dayKey(ultimaCrisis() + 90 * DIA);
    out += `<div class="card sky"><span style="font-size:14px;font-weight:600">Sin dolor</span><span class="G" style="font-size:56px;letter-spacing:-0.04em;line-height:.95">${plural(ds, 'día', 'días')}</span><div class="bar"><i style="width:${pct}%"></i></div><div class="between" style="font-size:13px"><span>${Math.min(ds, 90)} de 90 días</span><span>${ds >= 90 ? '¡3 meses!' : '3 meses el ' + fechaCorta(f3)}</span></div></div>`; }

/* ---------------- Registro ---------------- */
function itemsRegistro() {
  const it = [];
  vivos('eventos').forEach(e => it.push({ t: inicioEv(e), tipo: esCrisis(e) ? 'crisis' : 'laura', r: e }));
  vivos('efectos').forEach(r => it.push({ t: r.t, tipo: 'efecto', r }));

}

  out += `<div class="chips">${[['todo', 'Todo'], ['crisis', 'Crisis'], ['laura', 'Laura'], ['efecto', 'Efectos'], ['comida', 'Comida'], ['sueno', 'Sueño']].map(([v, t]) => `<button class="chip ${f === v ? 'on' : ''}" data-a="filtro" data-v="${v}">${t}</button>`).join('')}</div>`;

function ultimaPrueba(tipo) { return vivos('pruebas').filter(p => (p.tipo || '').toLowerCase().includes(tipo.toLowerCase())).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''))[0]; }

/* ---------------- Patrones ---------------- */
function crisisL() { return vivos('eventos').filter(esCrisis).map(e => ({ e, t: e.dolor || e.pinchazos[0] })).sort((a, b) => a.t - b.t); }
function analisisComida() {
  const com = vivos('comidas'); if (!com.length) return { dias: 0, crisis: 0, listo: false, items: [] };
  const desde = Math.min(...com.map(c => c.t));

  com.forEach(c => { const its = (c.items || []).concat(c.bebidas || []); its.forEach(i => add(norm(i), i).dias.add(dayKey(c.t))); (c.vig || vigiladosDe(its)).forEach(v => add('#' + v, cap(v)).dias.add(dayKey(c.t))); });
  cr.forEach(x => { const vis = new Set(); com.filter(c => c.t < x.t && c.t > x.t - DIA).forEach(c => { const its = (c.items || []).concat(c.bebidas || []); its.forEach(i => vis.add(norm(i))); vigiladosDe(its).forEach(v => vis.add('#' + v)); }); vis.forEach(k => { if (items[k]) items[k].antes++; }); });
  const res = Object.values(items).map(x => ({ txt: x.txt, antes: x.antes, pctDias: Math.round(x.dias.size / diasCom.size * 100), pctCrisis: cr.length ? Math.round(x.antes / cr.length * 100) : 0 })).filter(x => x.antes >= 2 && x.pctCrisis > x.pctDias + 15).sort((a, b) => (b.pctCrisis - b.pctDias) - (a.pctCrisis - a.pctDias)).slice(0, 6);
  return { dias: diasCom.size, crisis: cr.length, listo, items: res };
}
function analisisFactores() {
  const dias = vivos('dias').filter(d => (d.chips || []).length || d.fondo || d.agua);
  const cr = crisisL(); const out = [];
  if (dias.length < 14 || cr.length < 3) return null;
  const crisisEn = day => cr.some(x => { const d = dayKey(x.t); return d === day || d === sumarDias(day, 1); });
  CHIPS_DIA.forEach(ch => {
    const con = dias.filter(d => (d.chips || []).includes(ch)), sin = dias.filter(d => !(d.chips || []).includes(ch));
    if (con.length < 2) return;
    const a = con.filter(d => crisisEn(d.id)).length, b = sin.filter(d => crisisEn(d.id)).length;
    out.push({ ch, con: con.length, a, pa: Math.round(a / con.length * 100), pb: sin.length ? Math.round(b / sin.length * 100) : 0 });
  });
  return out.sort((x, y) => (y.pa - y.pb) - (x.pa - x.pb));
}
function pPatrones() {

  const sem = cr.filter(x => x.t > now() - 7 * DIA).length, ant = cr.filter(x => x.t > now() - 35 * DIA && x.t <= now() - 7 * DIA).length / 4;

  const ds = diasSinDolor();

  // Temporadas: 26 semanas

  d.innerHTML = `<span>${esc(msg)}</span>${deshacer ? '<button data-a="deshacer">Deshacer</button>' : ''}`;
  document.body.appendChild(d);

  'preg-add': () => { const t = (S.f.preg || '').trim(); if (!t) return; const c = proximaCita(); c.preguntas = (c.preguntas || []).concat([{ txt: t }]); poner('citas', c); S.f.preg = ''; S.mantenerScroll = true; repintar(); },
  'copiar-informe': async () => { const txt = 'Informe de Laura (registro personal de cefalea en racimos)\n\n' + informe().join('\n\n'); try { await navigator.clipboard.writeText(txt); toast('Informe copiado'); } catch (e) { S.sheet = () => `<span class="G h3">Copia el informe</span><textarea class="f" style="min-height:300px">${esc(txt)}</textarea><button class="btn" data-a="cerrar-sheet">Cerrar</button>`; repintar(); } },
  'prueba-tipo': v => { S.f.pruebaTipo = v; S.mantenerScroll = true; repintar(); },
  'prueba-add': () => { if (!S.f.pruebaTipo) { toast('Elige el tipo de prueba'); return; } poner('pruebas', { id: uid(), tipo: S.f.pruebaTipo, fecha: S.f.pruebaFecha || dayKey(now()), res: S.f.pruebaRes || '' }); S.f.pruebaTipo = S.f.pruebaRes = ''; S.mantenerScroll = true; repintar(); },
  'prueba-borrar': v => { borrar('pruebas', v); S.mantenerScroll = true; repintar(); },
  cfg: (v, el) => { const k = el.dataset.k; setCfg({ [k]: k === 'margen' ? Number(v) : v }); S.mantenerScroll = true; repintar(); },
  'cfg-plumas-av': v => { setCfg({ avisoPlumas: Math.max(1, CFG().avisoPlumas + Number(v)) }); S.mantenerScroll = true; repintar(); },
  'vig-add': () => { const t = norm(S.f.vig); if (!t) return; setCfg({ vigilados: [...new Set((CFG().vigilados || []).concat([t]))] }); S.f.vig = ''; S.mantenerScroll = true; repintar(); },
  'vig-quitar': v => { setCfg({ vigilados: (CFG().vigilados || []).filter(x => x !== v) }); S.mantenerScroll = true; repintar(); },
  login: async v => {
    const f = S.f.login || {}; f.err = '';
    try { await SYNC.entrar((f.email || '').trim(), f.pass || '', v === 'nueva'); S.f.login = null; toast('Nube conectada'); }
    catch (e) { f.err = errNube(e); }
    repintar();
  },
  relogin: async () => { try { await SYNC.entrar(SYNC.meta.email, (S.f.login || {}).pass || '', false); toast('Conectado'); } catch (e) { toast(errNube(e)); } repintar(); },
  logout: async () => { await SYNC.salir(); repintar(); },
  'avisos-on': () => activarAvisos(),
  exportar: async () => {
    const txt = JSON.stringify({ app: 'laura', v: 1, fecha: now(), DB });
    const file = new File([txt], 'laura-copia-' + dayKey(now()) + '.json', { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Copia de Laura' }); return; } catch (e) { if (e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(txt); toast('Copia copiada: pégala en Notas o en un correo'); } catch (e) { toast('No se ha podido copiar'); }
  },
  importar: () => { S.sheet = () => `<span class="G h3">Recuperar una copia</span><span class="small">Pega aquí el texto de la copia. Se junta con lo que hay: no se borra nada.</span><textarea class="f" data-in="imp-txt" style="min-height:200px"></textarea><button class="btn" data-a="imp-ok">Recuperar</button><button class="btn chipc" data-a="cerrar-sheet">Cancelar</button>`; repintar(); },
  'imp-ok': () => {
    try { const j = JSON.parse(S.f.imp || ''); const src = j.DB || j; let n = 0; COLS.forEach(c => (src[c] || []).forEach(r => { const i = DB[c].findIndex(x => x.id === r.id); if (i < 0 || (r.upd || 0) > (DB[c][i].upd || 0)) { if (i < 0) DB[c].push(r); else DB[c][i] = r; SYNC.marcar(c, r.id); n++; } })); guardar(); S.sheet = null; repintar(); toast(plural(n, 'registro recuperado', 'registros recuperados')); }
    catch (e) { toast('Ese texto no es una copia de Laura'); }
  },
  actualizar: () => { if (window.__swEsperando) window.__swEsperando.postMessage('skipWaiting'); else location.reload(); }
};
function tog(arr, v) { arr = (arr || []).slice(); const i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); return arr; }
function marcarToma(day, hora, t, estado) {
  const s = tomasDelDia(day).find(x => x.hora === hora); if (!s) return;
  guardarUndo('tomas', null); const ids = [];
  s.meds.forEach(m => { if (!tomaDe(day, hora, m.id)) { const r = { id: uid(), medId: m.id, slot: slotId(day, hora, m.id), t, estado, tz: tzHere() }; poner('tomas', r); ids.push(r.id); } });
  S.undo.multi = ids; S.undo.id = ids[0];
  S.mantenerScroll = true; repintar(); toast(estado === 'olvidada' ? 'Apuntada como no tomada' : (s.meds.length > 1 ? 'Tomadas' : 'Tomada'), true);
}
function guardarSuenoManual(cambios) {
  let s = ultimoSueno();
  const ins = { dormir: document.querySelector('[data-in="sueno-dormir"]'), desp: document.querySelector('[data-in="sueno-despertar"]') };
  const hoy = dayKey(now());
  if (!s) s = { id: uid(), tz: tzHere(), manual: true };
  if (ins.dormir && ins.dormir.value) { let t = epochDe(hoy, ins.dormir.value, tzHere()); if (t > now()) t -= DIA; if (!s.auto || !s.dormir) s.dormir = t; else if (hhmm(s.dormir) !== ins.dormir.value) s.dormir = t; }
  if (ins.desp && ins.desp.value) { let t = epochDe(hoy, ins.desp.value, tzHere()); if (t > now() + 5 * MIN) t -= DIA; s.despertar = t; }
  if (s.despertar && s.dormir && s.despertar < s.dormir) s.dormir -= DIA;
  Object.assign(s, cambios); poner('suenos', s); S.mantenerScroll = true; repintar();
}

/* ---------------- Entradas de texto ---------------- */
const INP = {
  'dist-txt': v => { const e = porId('eventos', S.f.evId); e.distinta = Object.assign(e.distinta || {}, { txt: v }); poner('eventos', e); },
  'sueno-dormir': () => guardarSuenoManual({}), 'sueno-despertar': () => guardarSuenoManual({}),
  'ef-otro': v => S.f.efecto.otro = v, 'ef-pulso': v => S.f.efecto.pulso = v, 'ef-tension': v => S.f.efecto.tension = v, 'ef-hora': v => S.f.efecto.hora = v,
  'co-hora': v => S.f.comida.hora = v,
  'pa-dia': v => S.f.pasada.dia = v, 'pa-laura': v => S.f.pasada.laura = v, 'pa-dolor': v => S.f.pasada.dolor = v, 'pa-pinchazo': v => { S.f.pasada.pinchazo = v; }, 'pa-fin': v => S.f.pasada.fin = v,
  'med-nombre': v => S.f.med.nombre = v, 'med-dosis': v => S.f.med.dosis = v, 'med-desde': v => S.f.med.desde = v,
  'ta-nombre': v => S.f.tanda.nombre = v, 'ta-inicio': v => { S.f.tanda.inicio = v; }, 'ta-ini': v => { S.f.tanda.dosisIni = v; }, 'ta-baja': v => { S.f.tanda.bajada = v; }, 'ta-cada': v => { S.f.tanda.cada = v; }, 'ta-hora': v => S.f.tanda.hora = v,
  'cita-tipo': v => S.f.cita.tipo = v, 'cita-dia': v => S.f.cita.dia = v, 'cita-hora': v => S.f.cita.hora = v, 'cita-lugar': v => S.f.cita.lugar = v, 'cita-notas': v => S.f.cita.notas = v,
  'preg-txt': v => S.f.preg = v, 'prueba-fecha': v => S.f.pruebaFecha = v, 'prueba-res': v => S.f.pruebaRes = v,
  'cfg-cig': v => setCfg({ cig: v }), 'cfg-home': v => { setCfg({ homeTz: v }); repintar(); },
  'vig-txt': v => S.f.vig = v, 'login-email': v => { S.f.login = S.f.login || {}; S.f.login.email = v; }, 'login-pass': v => { S.f.login = S.f.login || {}; S.f.login.pass = v; },
  'otra-hora': v => S.f.otra.hora = v, 'imp-txt': v => S.f.imp = v, 'co-q': null
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'cerrar-sheet' && ev.target.closest('[data-stop]') && !ev.target.closest('button')) return;
  const f = ACC[el.dataset.a];
  if (f) { ev.preventDefault(); f(el.dataset.v, el); }
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'co-q') { S.f.comida.q = el.value; const pos = el.selectionStart; repintar(); const n = document.querySelector('[data-in="co-q"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } return; }
  if (k === 'med-hora') { S.f.med.horas[+el.dataset.i] = el.value; return; }
  if (['sueno-dormir', 'sueno-despertar', 'cfg-home'].includes(k)) return;
  if (INP[k]) INP[k](el.value);
});
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (['sueno-dormir', 'sueno-despertar', 'cfg-home'].includes(k)) INP[k](el.value);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.in === 'co-q') { ev.preventDefault(); ACC['co-add'](); } if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.in === 'preg-txt') { ev.preventDefault(); ACC['preg-add'](); } });

/* =========================================================
   ARRANQUE
   ========================================================= */
function desdeAviso(abrir) { if (!abrir) return; if (abrir === 'inicio') { S.cierre = null; ir('inicio'); } else ir(abrir); }
(function init() {
  if (!DB.cfg.find(r => r.id === 'cfg')) { DB.cfg.push(Object.assign({}, CFG_DEF, { homeTz: tzHere().startsWith('Europe/') || tzHere().startsWith('Atlantic/') ? tzHere() : 'Europe/Madrid', upd: 0 })); guardar(); }
  const h = location.hash.replace('#', '');
  S.pant = ['hoy', 'registro', 'medicinas', 'patrones', 'consulta', 'ajustes'].includes(h) ? h : 'inicio';
  if (h) history.replaceState(null, '', location.pathname);
  repintar();
  SYNC.arrancar();
  setInterval(() => { if (S.pant === 'inicio' && !S.sheet) repintar(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (abierto() || S.pant !== 'inicio') { /* sigue donde estaba */ } repintar(); revisarAviso(); if (SYNC.user) SYNC.subir(); } });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const esperar = w => { window.__swEsperando = w; S.nuevaVersion = true; if (S.pant === 'hoy') repintar(); };
      if (reg.waiting && navigator.serviceWorker.controller) esperar(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) esperar(w); }); });
    }).catch(() => {});
    let recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargado && window.__swEsperando) { recargado = true; location.reload(); } });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.abrir !== undefined) desdeAviso(e.data.abrir); });
  }
})();

</script>
