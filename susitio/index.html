<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Susitio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2A2320; --muted:#6E625A; --line:#F1E4D4; --soft:#FFF1E0;
  --teal:#1D6B66; --teal-d:#14524E; --teal-s:#E3F0EE; --teal-t:#CFE7E3;
  --good:#1D6B66; --reg:#F2B880; --reg-t:#4A2402; --bad:#8A3A06;
  --or-s:#FFE3C7; --or-t:#5C2800; --or-k:#8A3D00; --pu-s:#EADFFB; --pu-t:#3E1F70; --pu-k:#5B2E9E;
  --warn:#A04A00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(118px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px}
.b{font-weight:800}
.card{background:var(--card);border-radius:24px;padding:16px}
.sec-title{font-size:20px;font-weight:800;margin:4px 4px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

/* Cabecera */
.top{display:flex;align-items:center;gap:14px}
.top h1{font-size:26px;font-weight:800;line-height:1.15}
.avatar-btn{min-width:44px;height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--teal-d);padding:0 12px}
.ring{position:relative;width:56px;height:56px;flex:0 0 56px}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}

/* Tarjeta principal */
.hero{background:var(--teal);color:#fff;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .kicker{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-t)}
.hero h2{font-size:32px;font-weight:800;line-height:1.1}
.pill-btn{min-height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.16);font-size:15px;font-weight:800;color:#fff}
.hero-item{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:56px;border:2px solid transparent}
.hero-item .n{font-size:16px;font-weight:800}
.hero-item .d{font-size:14px;color:var(--teal-t)}
.hero-item[aria-pressed=false]{background:transparent;border:2px dashed rgba(255,255,255,.45)}
.hero-item[aria-pressed=false] .n{text-decoration:line-through;opacity:.75}
.hero-peso{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:16px;padding:8px 8px 8px 14px}
.hero-peso label{font-size:16px;font-weight:800;flex:1}
.hero-peso input{width:120px;height:48px;border-radius:12px;border:0;text-align:center;font-size:24px;font-weight:800;color:var(--ink);background:#fff}
.hero-time{width:120px;height:40px;border-radius:999px;border:0;padding:0 10px;font-size:16px;font-weight:800;background:#fff;color:var(--ink)}
.btn{min-height:54px;border-radius:16px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;width:100%;padding:0 16px;text-align:center}
.btn-big{min-height:62px;font-size:19px;border-radius:18px}
.btn-white{background:#fff;color:var(--teal-d)}
.btn-teal{background:var(--teal);color:#fff}
.btn-line{border:2px solid var(--teal);color:var(--teal-d);background:#fff}
.btn-danger{border:2px solid #B4591A;color:#7A3A04;background:#fff}
.btn-soft{background:var(--soft);color:var(--ink)}
.done-card{background:var(--teal-s);border-radius:28px;padding:18px;display:flex;align-items:center;gap:14px}
.tick{width:48px;height:48px;border-radius:999px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:0 0 48px}
.mini{background:#fff;border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px}
.mini .ico{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}

/* Avisos */
.aviso{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left}
.aviso .k{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.aviso .t{font-size:17px;font-weight:800}
.aviso .s{font-size:14px}
.aviso.or{background:var(--or-s);color:var(--or-t)} .aviso.or .k{color:var(--or-k)}
.aviso.pu{background:var(--pu-s);color:var(--pu-t)} .aviso.pu .k{color:var(--pu-k)}
.aviso .act{margin-top:4px;min-height:44px;border-radius:12px;background:rgba(255,255,255,.75);font-weight:800;font-size:15px;padding:0 12px}
.aviso .acts{display:flex;flex-wrap:wrap;gap:6px}
.aviso .acts .act{flex:1 1 auto}

/* Estadísticas */
.stat{background:#fff;border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-height:96px}
.stat .l{font-size:13px;font-weight:700;color:var(--muted)}
.stat .v{font-size:22px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.stat .v.vacio{font-size:18px;color:var(--teal-d)}
.stat .s{font-size:13px;color:var(--muted)}

/* Chips y formularios */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #D9CBBB;background:#fff;font-weight:700;font-size:15px}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:800}
.chip.add{border-style:dashed;border-color:var(--teal);color:var(--teal-d)}
.seg{display:grid;gap:6px;background:#F6E7D4;border-radius:14px;padding:4px}
.seg button{min-height:44px;border-radius:10px;font-size:15px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{height:52px;border:1.5px solid #D9CBBB;border-radius:14px;padding:0 12px;font-size:17px;width:100%;background:#fff;color:var(--ink);font-weight:600}
textarea.field{height:auto;padding:12px;resize:none;line-height:1.4}
.lbl{font-size:14px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form{display:flex;flex-direction:column;gap:14px}
.dia-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dia-opts button{min-height:56px;border-radius:16px;font-size:17px;font-weight:800;border:1.5px solid #D9CBBB;background:#fff}
.dia-opts button[data-v=bueno][aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
.dia-opts button[data-v=regular][aria-pressed=true]{background:var(--reg);border-color:var(--reg);color:var(--reg-t)}
.dia-opts button[data-v=malo][aria-pressed=true]{background:var(--bad);border-color:var(--bad);color:#fff}
.list-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list-row:first-child{border-top:0}
.ini{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:0 0 36px;background:var(--teal);color:#fff}
.ini.sara{background:var(--reg);color:var(--reg-t)}
.x-btn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 44px}

/* Progreso */
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big3 div{border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.big3 .n{font-size:38px;font-weight:800;line-height:1}
.big3 .t{font-size:14px;font-weight:700}
.bar{display:flex;gap:2px;height:30px}
.bar span{border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;min-width:22px}
.bar .g{background:var(--good);color:#fff} .bar .r{background:var(--reg);color:var(--reg-t)} .bar .m{background:var(--bad);color:#fff} .bar .e{border:1.5px dashed #D9CBBB}
.etapa{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.week{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center;min-height:46px}
.marker{display:flex;align-items:center;gap:8px;padding:6px 0}
.marker i{height:2px;flex:1;background:var(--teal)}
.marker b{font-size:12px;color:#fff;background:var(--teal);border-radius:999px;padding:4px 10px;max-width:75%;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -4px 18px rgba(42,35,32,.07);padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;font-size:12px;font-weight:800;color:#8F837A}
.tab[aria-current=page]{color:var(--teal)}
.tab-plus{justify-self:center;width:62px;height:62px;margin-top:-28px;border-radius:999px;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(29,107,102,.35)}
.tab-plus[aria-current=page]{background:var(--teal-d)}

/* Hoja inferior */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(42,35,32,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#D9CBBB;align-self:center;margin-bottom:4px}
.sheet h2{font-size:24px;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;font-size:15px;max-width:90%;text-align:center}
.banner{background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.banner button{background:#fff;color:var(--ink);border-radius:12px;min-height:40px;padding:0 12px;font-weight:800}
.empty{border:1.5px dashed #D9CBBB;border-radius:22px;padding:16px;color:var(--muted);font-size:15px;text-align:center}
.who{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;padding:24px 8px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" aria-label="Secciones"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
/* =========================================================
   Susitio · control veterinario de Susi
   Datos: se guardan en este móvil (localStorage). Cada registro
   lleva id, autor y "upd" (momento del último cambio), y lo que
   se borra queda marcado como borrado: así mañana se pueden
   juntar los datos de Sena y Sara en la nube sin perder nada.
   ========================================================= */
const VERSION = '2.3';
const KEY = 'susitio-datos';
const KEY_YO = 'susitio-yo';

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000);
const dow = s => (parseD(s).getDay() + 6) % 7; // lunes = 0
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
// El "día de Susi" empieza a las 4:00: una toma de noche dada a las 00:30 cuenta para el día anterior.
const hoy = () => { const d = new Date(Date.now() - 4 * 3600000); return dstr(d); };
const horaSusi = () => { const d = new Date(); return (d.getHours() + 20) % 24; }; // horas desde las 4:00
const DIAS = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
const DIAS_L = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const DIAS_1 = ['L', 'M', 'X', 'J', 'V', 'S', 'D'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fFecha = s => { const d = parseD(s); return DIAS[dow(s)] + ' ' + d.getDate() + ' ' + MESES[d.getMonth()]; };
const fCorta = s => { const d = parseD(s); return d.getDate() + ' ' + MESES[d.getMonth()]; };
const lunes = s => addDays(s, -dow(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (v == null || v === '') return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fNum = n => String(Math.round(n * 100) / 100).replace('.', ',');

/* ---------- Datos ---------- */
const COLS = ['meds', 'tomas', 'semanales', 'cacas', 'comidas', 'apetito', 'cambios', 'diluciones', 'ajustes', 'sintomas'];
const metaComida = () => { const r = (DB.ajustes || []).find(x => x.id === 'meta-comida' && !x.borrado); return r && r.g > 0 ? r.g : 100; };
let DB;
function vacio() { const o = { v: 1 }; COLS.forEach(c => o[c] = []); return o; }
function cargar() {
  try { DB = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { DB = null; }
  if (!DB) DB = vacio();
  COLS.forEach(c => { if (!Array.isArray(DB[c])) DB[c] = []; });
  if (!DB.meds.length) sembrarMeds(); else migrar();
}
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch (e) { toast('No se ha podido guardar en el móvil'); }
}
function sembrarMeds() {
  const t = Date.now();
  const slug = n => 'med-' + n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-');
  const m = (o) => Object.assign({ id: slug(o.nombre), activo: true, upd: 1, autor: yo() || 'Sena', desde: hoy() }, o);
  DB.meds = [
    m({ nombre: 'Prednisona', dosis: '0,07 ml', tipo: 'diario', momentos: ['manana', 'noche'] }),
    m({ nombre: 'Pepcid', dosis: '0,2 ml', tipo: 'diario', momentos: ['manana', 'noche'] }),
    m({ nombre: 'Imurel', dosis: '0,05 ml', tipo: 'diario', momentos: ['noche'], dil: { cada: 4, texto: '1 pastilla en 2 ml de agua' } }),
    m({ nombre: 'Vitamina B12', dosis: '0,25 ml subcutánea', tipo: 'semanal', dias: [1, 4], aviso: true }),
    m(SUPL.melena), m(SUPL.maxi), m(SUPL.glut)
  ];
  DB.migr = 3;
  guardar();
}
// Suplementos: se preparan para varios días y se le da un poco cada día
const SUPL = {
  melena: { nombre: 'Melena de león', dosis: '1 g por semana', tipo: 'diario', momentos: ['manana', 'noche'], dil: { cada: 7, texto: '1 g para toda la semana (de martes a martes)' } },
  maxi: { nombre: 'Maxi Digest', dosis: '1 g por semana', tipo: 'diario', momentos: ['manana', 'noche'], dil: { cada: 7, texto: '1 g para toda la semana (de martes a martes)' } },
  glut: { nombre: 'Glutamina', dosis: '1 g cada 4 días', tipo: 'diario', momentos: ['manana', 'noche'], dil: { cada: 4, texto: '1 g para 4 días' } }
};
function migrar() {
  if ((DB.migr || 1) >= 2) return;
  const map = { 'Melena de león': SUPL.melena, 'Maxi Digest': SUPL.maxi, 'Glutamina': SUPL.glut };
  DB.meds.forEach(m => {
    const n = map[m.nombre];
    if (n && m.tipo === 'semanal' && !(m.dias || []).length) { delete m.dias; delete m.aviso; Object.assign(m, JSON.parse(JSON.stringify(n))); m.upd = Date.now(); }
  });
  DB.migr = 2;
  guardar();
}
// Versión 3: los suplementos se dan con la medicación, en las dos tomas
function migrar3() {
  if ((DB.migr || 1) >= 3) return;
  const map = { 'melena de león': SUPL.melena, 'maxi digest': SUPL.maxi, 'glutamina': SUPL.glut };
  DB.meds.forEach(m => {
    const n = map[(m.nombre || '').toLowerCase()];
    if (n && m.tipo === 'diario' && !(m.momentos || []).length) { m.momentos = ['manana', 'noche']; m.dosis = n.dosis; m.upd = Date.now(); SYNC.marcar('meds', m.id); }
  });
  DB.migr = 3;
  guardar();
}
const vivos = c => DB[c].filter(r => !r.borrado);
function poner(col, rec) {
  rec.upd = Date.now();
  if (!rec.autor) rec.autor = yo();
  const i = DB[col].findIndex(r => r.id === rec.id);
  if (i >= 0) DB[col][i] = rec; else DB[col].push(rec);
  guardar();
  SYNC.marcar(col, rec.id);
}
function borrar(col, id) {
  const r = DB[col].find(x => x.id === id);
  if (r) { r.borrado = true; r.upd = Date.now(); r.por = yo(); guardar(); SYNC.marcar(col, id); }
}
// Junta dos copias (otro móvil, una copia de seguridad o la nube): gana el cambio más reciente de cada registro.
function juntar(otro) {
  let n = 0;
  COLS.forEach(c => {
    (otro[c] || []).forEach(r => {
      if (!r || !r.id) return;
      const i = DB[c].findIndex(x => x.id === r.id);
      if (i < 0) { DB[c].push(r); n++; SYNC.marcar(c, r.id); }
      else if ((r.upd || 0) > (DB[c][i].upd || 0)) { DB[c][i] = r; n++; SYNC.marcar(c, r.id); }
    });
  });
  guardar();
  return n;
}

/* ---------- Quién usa el móvil ---------- */
function yo() { try { return localStorage.getItem(KEY_YO) || ''; } catch (e) { return ''; } }
function setYo(n) { try { localStorage.setItem(KEY_YO, n); } catch (e) {} }

/* ---------- Consultas ---------- */
const medsActivos = () => vivos('meds').filter(m => m.activo);
const medsToma = mom => medsActivos().filter(m => m.tipo === 'diario' && (m.momentos || []).includes(mom));
const medsSueltos = () => medsActivos().filter(m => m.tipo === 'diario' && !(m.momentos || []).length);
const tomaDe = (f, mom) => vivos('tomas').find(t => t.fecha === f && t.momento === mom);
const cacaDe = f => vivos('cacas').find(c => c.fecha === f);
const hk = h => !h ? '0' : (h < '04' ? '2' : '1') + h; // las horas de madrugada van al final del día
const comidasDe = f => vivos('comidas').filter(c => c.fecha === f).sort((a, b) => hk(a.hora).localeCompare(hk(b.hora)));
const apetitoDe = f => vivos('apetito').find(a => a.fecha === f);
const ultimaDil = medId => vivos('diluciones').filter(d => d.medId === medId).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
const semanalHoy = (medId, f) => vivos('semanales').find(s => s.medId === medId && s.fecha === f);

function semanas(desde, hasta, map) {

  const res = lista.map(l => { const a = l < desde ? desde : l, b = addDays(l, 6) > hasta ? hasta : addDays(l, 6); const r = resumen(a, b, map); r.l = l; r.dias = diffDays(addDays(l, 6), a) + 1; r.cambios = cambios.filter(c => c.fecha >= l && c.fecha <= addDays(l, 6)); return r; });
  res.forEach((r, i) => {
    const prev = res[i + 1];

    const vac = Math.max(0, r.dias - r.tot);

function vistaDiario() {

  let h = `<header class="col" style="gap:4px"><h1 style="font-size:30px;font-weight:800">Diario</h1><span class="small muted">Todo lo apuntado, de Sena y de Sara, en el orden del día. Toca algo para cambiarlo o borrarlo.</span></header>`;
  if (!ev.length) return h + `<div class="empty">Aún no hay nada apuntado.</div>`;
  const grupos = [];
  ev.slice(0, S.diarioN).forEach(e => { let g = grupos[grupos.length - 1]; if (!g || g.f !== e.f) { g = { f: e.f, l: [] }; grupos.push(g); } g.l.push(e); });
  const hh = hoy();
  grupos.forEach(g => {
    h += `<section class="col" style="gap:8px"><h2 class="sec-title" style="font-size:16px;color:var(--muted)">${g.f === hh ? 'Hoy · ' : g.f === addDays(hh, -1) ? 'Ayer · ' : ''}${fFecha(g.f)}</h2><div class="card" style="padding:4px 14px">${g.l.map(e => `<button class="list-row" data-a="${e.a}" data-id="${e.id}" ${e.col ? `data-col="${e.col}"` : ''} ${e.fecha ? `data-f="${e.fecha}"` : ''}>${ini(e.autor)}<span class="col grow"><span class="b" style="font-size:16px">${esc(e.t)}</span>${e.d ? `<span class="small muted">${esc(e.d)}</span>` : ''}</span><span class="small b muted">${esc(e.h || '')}</span></button>`).join('')}</div></section>`;
  });
  if (ev.length > S.diarioN) h += `<button class="btn btn-soft" data-a="diario-mas">Ver más</button>`;
  return h;
}

/* =========================================================
   HOJA: EDITAR TOMA
   ========================================================= */
function sheetToma(t, mom) {
  const f = hoy();
  if (t) S.form = { id: t.id, fecha: t.fecha, momento: t.momento, hora: t.hora, peso: t.peso != null ? fNum(t.peso) : '', sel: Object.fromEntries((t.meds || []).map(m => [m.id, true])), autor: t.autor, existe: true };
  else S.form = { id: 'toma-' + f + '-' + mom, fecha: f, momento: mom, hora: nowHM(), peso: '', sel: Object.fromEntries(medsToma(mom).map(m => [m.id, true])), existe: false };
  abrirSheet('toma');
}
function vistaSheetToma() {
  const F = S.form;
  const ids = new Set(medsToma(F.momento).map(m => m.id).concat(Object.keys(F.sel)));
  const meds = [...ids].map(id => DB.meds.find(m => m.id === id)).filter(Boolean);
  return `<h2>Toma de la ${NOMBRE_MOM[F.momento]}</h2><span class="small muted" style="margin-top:-8px">${fFecha(F.fecha)}${F.existe ? ' · apuntada por ' + esc(F.autor) : ''}</span>
    <div class="form">
      <div class="grid2"><label class="lbl">Hora<input class="field" type="time" data-bind="form.hora" value="${esc(F.hora)}"></label><label class="lbl">Peso (g)<input class="field" inputmode="decimal" data-bind="form.peso" value="${esc(F.peso)}" placeholder="—"></label></div>
      <div class="lbl">Qué se le dio<div class="chips">${meds.map(m => `<button class="chip" data-a="f-sel" data-id="${m.id}" aria-pressed="${!!F.sel[m.id]}">${esc(m.nombre)} · ${esc(m.dosis)}</button>`).join('')}</div></div>
      <button class="btn btn-teal" data-a="toma-guardar">Guardar</button>
      ${F.existe ? `<button class="btn btn-danger" data-a="toma-borrar">Borrar esta toma</button>` : ''}
    </div>`;
}

/* =========================================================
   Pintar
   ========================================================= */
function abrirSheet(tipo, extra) { S.sheet = { tipo, extra }; pintarSheet(); }
function cerrarSheet() { S.sheet = null; S.form = null; pintarSheet(); if (SYNC.pendiente) { SYNC.pendiente = false; repintar(); } }
function pintarSheet() {
  const el = document.getElementById('sheet');
  if (!S.sheet) { el.innerHTML = ''; return; }
  let c = '';
  const t = S.sheet.tipo;
  if (t === 'med') c = vistaSheetMed();
  else if (t === 'toma') c = vistaSheetToma();
  else if (t === 'quien') c = `<div class="who">${LOGO(88).replace('<svg', '<svg style="align-self:center"')}<h2>¿Quién usa este móvil?</h2><p class="muted">Así cada cosa que apuntes saldrá con tu nombre.</p><button class="btn btn-big btn-teal" data-a="soy" data-v="Sena">Soy Sena</button><button class="btn btn-big btn-line" data-a="soy" data-v="Sara">Soy Sara</button></div>`;
  else if (t === 'comida') c = `<h2>Comida</h2><div class="form"><label class="lbl">Qué<input class="field" data-bind="form.que" value="${esc(S.form.que)}"></label><div class="grid2"><label class="lbl">Hora<input class="field" type="time" data-bind="form.hora" value="${esc(S.form.hora)}"></label><label class="lbl">Gramos<input class="field" inputmode="decimal" data-bind="form.g" value="${esc(S.form.g)}" placeholder="—"></label></div><button class="btn btn-teal" data-a="comida-guardar">Guardar</button><button class="btn btn-danger" data-a="comida-borrar-sheet">Borrar</button></div>`;
  else if (t === 'nube') c = vistaSheetNube();
  else if (t === 'casa') c = vistaSheetCasa();
  else if (t === 'invitar') c = vistaSheetInvitar();
  else if (t === 'meta') c = `<h2>Meta de comida</h2><p class="small muted">Los gramos que debería comer al día. Se puede cambiar cuando quieras y vale para los dos móviles.</p><div class="form"><label class="lbl">Gramos al día<input class="field" id="meta-in" inputmode="decimal" value="${fNum(metaComida())}" style="font-size:24px;text-align:center;font-weight:800"></label><button class="btn btn-teal" data-a="meta-guardar">Guardar</button></div>`;
  else if (t === 'borrar') c = `<h2>¿Borrar?</h2><p class="muted">${esc(S.sheet.extra.texto)}</p><button class="btn btn-danger" data-a="borrar-ok">Borrar</button><button class="btn btn-soft" data-a="cerrar">Cancelar</button>`;
  else if (t === 'informe') c = `<h2>Informe</h2><p class="small muted">Si no se ha copiado solo, mantén pulsado el texto para copiarlo.</p><textarea class="field" rows="14" readonly>${esc(S.sheet.extra)}</textarea><button class="btn btn-soft" data-a="cerrar">Cerrar</button>`;
  const fijo = t === 'quien';
  el.innerHTML = `<div class="sheet-bg" ${fijo ? '' : 'data-a="cerrar-fondo"'}><div class="sheet" role="dialog" aria-modal="true">${fijo ? '' : '<span class="grab"></span>'}${c}</div></div>`;
}
function pintar() {
  const app = document.getElementById('app');
  const y = window.scrollY;
  let h = '';
  if (S.tab === 'hoy') h = vistaHoy();
  else if (S.tab === 'reg') h = vistaReg();
  else if (S.tab === 'prog') h = vistaProg();
  else if (S.tab === 'med') h = vistaMed();
  else if (S.tab === 'diario') h = vistaDiario();
  app.innerHTML = h;
  document.getElementById('tabs').innerHTML = [
    ['hoy', 'Hoy', I.home], ['prog', 'Progreso', I.prog], ['reg', '', ''], ['med', 'Medicación', I.med], ['diario', 'Diario', I.diario]
  ].map(([k, l, ic]) => k === 'reg'
    ? `<button class="tab-plus" data-a="tab" data-tab="reg" aria-label="Registrar" ${S.tab === k ? 'aria-current="page"' : ''}>${I.plus}</button>`
    : `<button class="tab" data-a="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}>${ic}${l}</button>`).join('');
  if (S.keepScroll) window.scrollTo(0, y);
  S.keepScroll = false;
  pintarBanner();
  pintarSheet();
}
function repintar() { S.keepScroll = true; pintar(); }
let toastT;
function toast(t) { const el = document.getElementById('toast'); el.innerHTML = `<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => el.innerHTML = '', 2400); }

/* =========================================================
   Acciones
   ========================================================= */
function setPath(path, v) {
  const p = path.split('.');
  let o = S;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length - 1]] = v;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) setPath(t.dataset.bind, t.value);
  if (t.dataset.hero) { const f = hoy(), mom = heroMomento(f); if (mom) heroForm(f, mom)[t.dataset.hero] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fecha && t.value) {
    const q = t.dataset.fecha;
    if (q === 'cacas') S.cacas.fecha = t.value; else { S.comida.fecha = t.value; S.comida.horas = null; }
    repintar();
  }
  if (t.dataset.repinta && S.tab === 'reg' && (S.comida.horas || []).length > 1) repintar();
  if (t.id === 'file-in' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); const n = juntar(o); toast(n ? 'Copia cargada: ' + n + ' registros' : 'No había nada nuevo'); repintar(); } catch (err) { toast('Ese archivo no es una copia de Susitio'); } };
    r.readAsText(t.files[0]);
    t.value = '';
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a, d = b.dataset;
  if (a === 'cerrar-fondo') { if (e.target === b) cerrarSheet(); return; }
  const f = hoy();
  switch (a) {
    case 'tab': S.tab = d.tab; window.scrollTo(0, 0); pintar(); break;
    case 'reg': S.tab = 'reg'; S.reg = d.reg; if (d.reg === 'cacas') S.cacas = null; pintar(); break;
    case 'cerrar': cerrarSheet(); break;
    case 'soy': setYo(d.v); cerrarSheet(); repintar(); toast('Hola, ' + d.v); break;
    case 'quien': abrirSheet('quien'); break;

    /* Hoy */
    case 'hero-hora': { const mom = heroMomento(f); const F = heroForm(f, mom); F.editHora = true; F.hora = F.hora || nowHM(); repintar(); const i = document.querySelector('.hero-time'); if (i) i.focus(); break; }
    case 'hero-med': { const mom = heroMomento(f); const F = heroForm(f, mom); F.sel[d.id] = F.sel[d.id] === false; repintar(); break; }
    case 'hero-dar': {
      const mom = d.mom; const F = heroForm(f, mom);
      const peso = num(F.peso);
      const meds = medsToma(mom).filter(m => F.sel[m.id] !== false).map(m => ({ id: m.id, nombre: m.nombre, dosis: m.dosis }));
      poner('tomas', { id: 'toma-' + f + '-' + mom, fecha: f, momento: mom, hora: F.editHora && F.hora ? F.hora : nowHM(), peso, meds, autor: yo() });
      delete S.hero[f + mom];
      toast('Toma de la ' + NOMBRE_MOM[mom] + ' apuntada' + (peso == null ? ' (sin peso)' : ''));
      window.scrollTo(0, 0); pintar(); break;
    }
    case 'toma-edit': { const t = DB.tomas.find(x => x.id === d.id); if (t) sheetToma(t); break; }
    case 'toma-nueva': sheetToma(null, d.mom); break;
    case 'f-sel': S.form.sel[d.id] = !S.form.sel[d.id]; pintarSheet(); break;
    case 'toma-guardar': {
      const F = S.form;
      const meds = Object.keys(F.sel).filter(k => F.sel[k]).map(id => { const m = DB.meds.find(x => x.id === id) || {}; return { id, nombre: m.nombre, dosis: m.dosis }; });
      const prev = DB.tomas.find(x => x.id === F.id);
      poner('tomas', { id: F.id, fecha: F.fecha, momento: F.momento, hora: F.hora || nowHM(), peso: num(F.peso), meds, autor: prev && !prev.borrado ? prev.autor : yo(), editadoPor: prev ? yo() : undefined });
      cerrarSheet(); repintar(); toast('Guardado'); break;
    }
    case 'toma-borrar': borrar('tomas', S.form.id); cerrarSheet(); repintar(); toast('Toma borrada'); break;
    case 'dil': poner('diluciones', { id: uid(), medId: d.id, fecha: addDays(f, -Number(d.d || 0)), hora: d.d === '0' ? nowHM() : '', autor: yo() }); repintar(); toast('Apuntado'); break;
    case 'sem-dar': { const m = DB.meds.find(x => x.id === d.id); poner('semanales', { id: uid(), medId: d.id, fecha: f, hora: nowHM(), dosis: m && m.dosis, autor: yo() }); repintar(); toast((m ? m.nombre : '') + ' apuntada'); break; }
    case 'sem-quitar': borrar('semanales', d.id); repintar(); break;
    case 'sup': { const s = semanalSemana(d.id, f); if (s) { abrirSheet('borrar', { col: 'semanales', id: s.id, texto: 'Quitar que se le dio ' + ((DB.meds.find(x => x.id === d.id) || {}).nombre || '') + ' el ' + fFecha(s.fecha) + '.' }); } else { const m = DB.meds.find(x => x.id === d.id); poner('semanales', { id: uid(), medId: d.id, fecha: f, hora: nowHM(), dosis: m && m.dosis, autor: yo() }); repintar(); toast((m ? m.nombre : '') + ' apuntado'); } break; }

    /* Registrar */
    case 'fecha': if (d.q === 'cacas') S.cacas.fecha = d.f; else { S.comida.fecha = d.f; S.comida.horas = null; } repintar(); break;
    case 'caca-tipo': { const F = cacasForm(); const i = F.tipos.indexOf(d.k); if (i >= 0) F.tipos.splice(i, 1); else F.tipos.push(d.k); repintar(); break; }
    case 'caca-dia': { const F = cacasForm(); F.dia = d.v; F.manual = true; repintar(); break; }
    case 'caca-guardar': {
      const F = cacasForm();
      const dia = F.manual ? F.dia : sugerirDia(F.tipos);
      if (!dia) { toast('Marca cómo han sido o elige cómo ha ido el día'); break; }
      poner('cacas', { id: 'caca-' + F.fecha, fecha: F.fecha, tipos: F.tipos.slice(), dia, manual: F.manual, hora: nowHM(), autor: yo() });
      F.cargada = null; toast('Cacas apuntadas: día ' + DIA_N[dia].toLowerCase()); repintar(); break;
    }
    case 'comida-rapida': { S.comida.que = d.v; const i = document.getElementById('c-que'); if (i) i.value = d.v; const g = document.getElementById('c-g'); if (g) g.focus(); break; }
    case 'comida-add': {
      const que = (S.comida.que || '').trim();
      if (!que) { toast('Escribe qué ha comido'); break; }
      const g = num(S.comida.g);
      const fe = S.comida.fecha || f;
      let horas = (S.comida.horas || []).filter(Boolean);
      if (!horas.length) horas = [''];
      const parte = g == null ? null : Math.round(g / horas.length * 10) / 10;
      horas.forEach(hh => poner('comidas', { id: uid(), fecha: fe, hora: hh, que, g: parte, autor: yo() }));
      S.comida.que = ''; S.comida.g = ''; S.comida.horas = null; repintar(); toast(horas.length > 1 ? 'Añadido en ' + horas.length + ' veces' : 'Añadido'); break;
    }
    case 'comida-borrar': borrar('comidas', d.id); repintar(); break;
    case 'comida-hora-mas': S.comida.horas.push(''); repintar(); break;
    case 'comida-hora-quitar': S.comida.horas.splice(Number(d.i), 1); repintar(); break;
    case 'comida-edit': { const c = DB.comidas.find(x => x.id === d.id); if (c) { S.form = { id: c.id, que: c.que, hora: c.hora || '', g: c.g != null ? fNum(c.g) : '' }; abrirSheet('comida'); } break; }
    case 'comida-guardar': { const c = DB.comidas.find(x => x.id === S.form.id); if (c) { const r = Object.assign({}, c, { que: (S.form.que || '').trim() || c.que, hora: S.form.hora, g: num(S.form.g) }); poner('comidas', r); } cerrarSheet(); repintar(); toast('Guardado'); break; }
    case 'comida-borrar-sheet': borrar('comidas', S.form.id); cerrarSheet(); repintar(); toast('Borrado'); break;
    case 'meta': abrirSheet('meta'); break;
    case 'meta-guardar': { const v = num(document.getElementById('meta-in').value); if (v == null || v <= 0) { toast('Pon los gramos de la meta'); break; } poner('ajustes', { id: 'meta-comida', g: v, autor: yo() }); cerrarSheet(); repintar(); toast('Meta: ' + fNum(v) + ' g al día'); break; }
    case 'apetito': { const fe = S.comida.fecha || f; const ex = apetitoDe(fe); if (ex && ex.valor === d.v) borrar('apetito', ex.id); else poner('apetito', { id: 'apetito-' + fe, fecha: fe, valor: d.v, hora: nowHM(), autor: yo() }); repintar(); break; }
    case 'sint-nuevo': S.sint = null; repintar(); break;
    case 'sint-tipo': S.sint.tipo = d.v; repintar(); break;
    case 'sint-asp': { const l = S.sint.aspecto; const i = l.indexOf(d.v); if (i >= 0) l.splice(i, 1); else l.push(d.v); repintar(); break; }
    case 'sint-cant': S.sint.cantidad = S.sint.cantidad === d.v ? '' : d.v; repintar(); break;
    case 'sint-guardar': {
      const F = S.sint;
      const rec = { id: F.id || uid(), fecha: F.fecha || f, hora: F.hora || '', tipo: F.tipo, aspecto: F.tipo === 'vomito' ? F.aspecto.slice() : [], cantidad: F.tipo === 'vomito' ? F.cantidad : '', nota: (F.nota || '').trim(), autor: F.autor || yo() };
      poner('sintomas', rec); S.sint = null; repintar(); toast(SINTOMA_N[rec.tipo] + ' apuntado'); break;
    }
    case 'sintoma-edit': { const x = DB.sintomas.find(y => y.id === d.id); if (x) { S.sint = { id: x.id, fecha: x.fecha, hora: x.hora || '', tipo: x.tipo, aspecto: (x.aspecto || []).slice(), cantidad: x.cantidad || '', nota: x.nota || '', autor: x.autor }; S.tab = 'reg'; S.reg = 'sintoma'; window.scrollTo(0, 0); pintar(); toast('Cambia lo que quieras y pulsa Guardar'); } break; }
    case 'sint-borrar': if (S.sint && S.sint.id) { borrar('sintomas', S.sint.id); S.sint = null; repintar(); toast('Borrado'); } break;
    case 'cambio-tipo': S.cambio.tipo = d.v; repintar(); break;
    case 'cambio-guardar': {
      const F = S.cambio;
      if (F.tipo === 'dieta' && !(F.alimento || '').trim()) { toast('Escribe qué come ahora'); break; }
      if (!F.texto.trim() && F.tipo !== 'dieta') { toast('Escribe qué ha cambiado'); break; }
      poner('cambios', { id: uid(), fecha: F.fecha || f, tipo: F.tipo, alimento: F.tipo === 'dieta' ? F.alimento.trim() : undefined, texto: F.texto.trim(), autor: yo() });

    case 'reg-caca': S.tab = 'reg'; S.reg = 'cacas'; S.cacas = { fecha: d.f }; window.scrollTo(0, 0); pintar(); break;

    /* Progreso */
    case 'rango': S.rango = d.v; repintar(); break;
    case 'informe': {
      const t = textoInforme();
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast('Informe copiado'), () => abrirSheet('informe', t));
      else abrirSheet('informe', t);
      break;

    case 'f-tipo': S.form.tipo = d.v; pintarSheet(); break;
    case 'f-mom': { const l = S.form.momentos || (S.form.momentos = []); const i = l.indexOf(d.v); if (i >= 0) l.splice(i, 1); else l.push(d.v); pintarSheet(); break; }
    case 'f-dia': { const l = S.form.dias || (S.form.dias = []); const v = Number(d.v); const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); l.sort(); pintarSheet(); break; }

      if (!F.nombre.trim()) { toast('Pon el nombre'); break; }
      const viejo = DB.meds.find(m => m.id === F.id);
      const rec = Object.assign({}, F); delete rec.nuevo; delete rec.ultPrep; delete rec.ultPrep0;
      if (rec.dil && F.ultPrep !== F.ultPrep0) { vivos('diluciones').filter(x => x.medId === F.id).forEach(x => borrar('diluciones', x.id)); if (F.ultPrep) poner('diluciones', { id: uid(), medId: F.id, fecha: F.ultPrep, hora: '', autor: yo() }); }

      if (rec.dil) { rec.dil.cada = Math.max(1, parseInt(rec.dil.cada, 10) || 4); }
      if (rec.tipo === 'diario') { delete rec.dias; delete rec.aviso; } else { delete rec.momentos; delete rec.dil; if (!(rec.dias || []).length) rec.aviso = false; }

      else {

    case 'exportar': exportar(); break;

    <button class="btn btn-teal" data-a="invitar-copiar">Copiar código</button><button class="btn btn-soft" data-a="cerrar">Hecho</button>`;
}
async function accionNube(a) {

      if (r === 'sin-casa') { A.msg = ''; abrirSheet('casa'); } else { cerrarSheet(); toast('Conectado: datos juntados con la nube'); }
    } else if (a === 'au-olvido') {

      await (await SYNC.cargar()).olvido(em); A.msg = 'Te hemos mandado un correo para cambiar la contraseña (mira en spam).'; A.ok = true; pintarSheet();
    } else if (a === 'casa-crear') {
      A.busy = true; pintarSheet(); await SYNC.crearCasa(); A.busy = false; cerrarSheet(); toast('Casa de Susi creada. Ahora invita a Sara.');
    } else if (a === 'casa-unirse') {
      A.busy = true; A.msg = ''; pintarSheet(); await SYNC.unirse(A.codigo); A.busy = false; cerrarSheet(); toast('Dentro: datos juntados con la nube');
    } else if (a === 'invitar') {
      const c = await SYNC.invitar(); abrirSheet('invitar', c);
    } else if (a === 'invitar-copiar') {
      try { await navigator.clipboard.writeText(S.sheet.extra); toast('Código copiado'); } catch (e) { toast('Mantén pulsado el código para copiarlo'); }
    } else if (a === 'sync-ahora') {
      if (!SYNC.unsub) await SYNC.conectar(); else await SYNC.subir(); toast(SYNC.status === 'ok' ? 'Sincronizado' : 'Sin conexión: se subirá más tarde');
    } else if (a === 'avisos-on') {
      await activarAvisos(); repintar();
    } else if (a === 'avisos-off') {
      try { await SYNC.fb.borrarAviso(SYNC.meta.casa, SYNC.meta.aviso.id); } catch (e) {}
      delete SYNC.meta.aviso; SYNC.guardarMeta(); repintar(); toast('Avisos desactivados en este móvil');
    } else if (a === 'nube-salir') {

    }
  } catch (e) { A.busy = false; A.msg = errNube(e); A.ok = false; if (S.sheet) pintarSheet(); else toast(A.msg); }
}
document.addEventListener('click', e => {

});
