/* ============ protección de datos: copias automáticas y aviso de la nube ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
const SNAP={db:null,t:0,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((ok,ko)=>{try{const q=indexedDB.open('espatontos-copias',1);q.onupgradeneeded=()=>q.result.createObjectStore('snaps');q.onsuccess=()=>{this.db=q.result;ok(this.db)};q.onerror=()=>ko(q.error)}catch(e){ko(e)}})},
  async put(){try{if(!hasLocalData())return;const db=await this.open(),day=todayStr(),j=JSON.stringify(D);
    await new Promise(ok=>{const tx=db.transaction('snaps','readwrite'),st=tx.objectStore('snaps');st.put({day,t:Date.now(),j},day);
      const k=st.getAllKeys();k.onsuccess=()=>{k.result.sort().reverse().slice(7).forEach(x=>st.delete(x))};tx.oncomplete=ok;tx.onerror=ok})}catch(e){}},
  async list(){try{const db=await this.open();return await new Promise(ok=>{const q=db.transaction('snaps').objectStore('snaps').getAll();q.onsuccess=()=>ok(q.result.sort((a,b)=>b.t-a.t));q.onerror=()=>ok([])})}catch(e){return []}},
  soon(){clearTimeout(this.t);this.t=setTimeout(()=>this.put(),5000)}};
const _save0=save;save=function(q){_save0(q);SNAP.soon()};
let SNAPS=[];
function snapSummary(j){try{const o=JSON.parse(j);return pl((o.nums||[]).length,'número','números')+' · '+pl((o.shows||[]).length,'show','shows')+' · '+pl((o.bolos||[]).length,'bolo','bolos')+' · '+pl(((o.ideas||{}).notes||[]).length,'nota','notas')}catch(e){return ''}}
S.snapOpen=async()=>{SNAPS=await SNAP.list();openSheet({title:'Copias automáticas',left:'Cerrar',body:()=>`<div class="f"><div class="note" style="padding:0 4px">La app guarda sola una copia al día de los últimos 7 días en este dispositivo. Si borras algo sin querer, puedes volver a como estaba.</div>
  ${SNAPS.length?`<div class="group">${SNAPS.map((s,i)=>`<button class="li" data-a="snapUse" data-i="${i}"><span class="tx"><b>${fdate(s.day)} · ${new Date(s.t).toTimeString().slice(0,5)}</b><small>${esc(snapSummary(s.j))}</small></span><span class="chev">›</span></button>`).join('')}</div>`:'<div class="note">Todavía no hay copias. Se crean solas mientras usas la app.</div>'}
  <div class="note">Ojo: estas copias viven en este dispositivo. Para no perder nada si le pasa algo al móvil, crea una cuenta o usa «Exportar copia».</div></div>`})};
S.snapUse=el=>{const s=SNAPS[+el.dataset.i];openSheet({title:'Volver a esta copia',body:()=>`<div class="f"><div class="note" style="padding:0 4px">${fdate(s.day)} · ${esc(snapSummary(s.j))}. Lo que tienes ahora se sustituirá por esta copia. Podrás deshacerlo justo después.</div><div class="act"><button data-a="snapOk" style="color:var(--accent);font-weight:600">Recuperar esta copia</button><button data-a="snapOpen">Cancelar</button></div></div>`});
  S.snapOk=()=>{closeSheet();withUndo('Copia recuperada',()=>{const o=JSON.parse(s.j),d=defaults();o.set=Object.assign(d.set,o.set||{},{tab:D.set.tab,seenGuide:true});D=Object.assign(d,o)})}};
function cloudNudge(){if(!SYNC.enabled())return;const m=SYNC.loadMeta();if(m.uid||!hasLocalData())return;
  let last=0;try{last=+localStorage.getItem('espatontos-aviso-nube')||0}catch(e){}if(Date.now()-last<3*864e5)return;
  try{localStorage.setItem('espatontos-aviso-nube',String(Date.now()))}catch(e){}
  openSheet({title:'Protege tus datos',left:'Ahora no',body:()=>`<div class="f"><div class="note" style="padding:0 4px;font-size:15px;line-height:21px;color:var(--text)">Ahora mismo todo lo que apuntas está guardado <b>solo en este dispositivo</b>. Si el iPhone borra los datos de la app o la desinstalas, se pierde.</div>
   <div class="note" style="padding:0 4px">Con una cuenta gratuita se guarda también en la nube y puedes abrirlo desde cualquier dispositivo.</div>
   <div class="act"><button data-a="authOpen" style="background:var(--accent);color:var(--onAccent);font-weight:600">Crear cuenta o entrar</button><button data-a="exportData">Prefiero exportar una copia</button></div></div>`})}
