<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bambalinas">
<meta name="theme-color" content="#F4F4F7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Bambalinas</title>
<style>
:root{
  --bg:#F4F4F7;--card:#FFFFFF;--text:#1C1C1E;--sec:#62626B;--sep:#E3E3E8;--field:#E9E9EE;--track:#ECECF1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,20,40,.06);--lift:0 14px 34px rgba(20,20,40,.18);
  --bar:rgba(250,250,252,.88);--sheet:#F4F4F7;--dim:rgba(0,0,0,.32);
  --warnBg:#FFF1E6;--warnText:#9A4A12;--badBg:#FDECEC;--badText:#B3261E;--tipBg:#EBEBF0;--tipText:#4A4A52;
  --good:#2F9E62;--accent:#4B5BDB;--onAccent:#FFFFFF;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
[data-theme=dark]{
  --bg:#0E0E11;--card:#1B1B20;--text:#F3F3F6;--sec:#A3A3AE;--sep:#2C2C33;--field:#24242A;--track:#2C2C33;
  --shadow:none;--lift:0 14px 34px rgba(0,0,0,.6);--bar:rgba(22,22,26,.86);--sheet:#16161A;--dim:rgba(0,0,0,.55);
  --warnBg:rgba(245,180,138,.16);--warnText:#F7C3A0;--badBg:rgba(255,107,107,.16);--badText:#FF9C9C;--tipBg:#26262D;--tipText:#C4C4CE;
  --good:#6FD39C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);-webkit-user-select:text;user-select:text}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;text-align:inherit}
svg{display:block}
#views{position:fixed;inset:0;bottom:calc(64px + var(--sb))}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;padding:calc(var(--st) + 12px) 0 40px}
.view.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hdr{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 4px}
.hdr .l{font-size:15px;color:var(--sec)}
h1{font-size:34px;font-weight:800;letter-spacing:-.8px;padding:0 4px;margin-bottom:12px}
.ibtn{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.ibtn.fill{background:var(--accent);color:var(--onAccent)}
.pill{height:34px;padding:0 14px;border-radius:17px;background:var(--accent);color:var(--onAccent);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.ghost{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--sep)}
.link{color:var(--accent);font-weight:500}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.sum{padding:18px 18px 14px;margin-bottom:16px}
.big{font-size:40px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.big small{font-size:17px;font-weight:600;color:var(--sec);letter-spacing:0;margin-left:4px}
.prog{height:6px;border-radius:3px;background:var(--track);margin-top:12px;overflow:hidden}
.prog i{display:block;height:6px;border-radius:3px;background:var(--accent);transition:width .3s}
.prog i.over{background:var(--badText)}
.curvebox{margin-top:14px}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--sec);margin-top:4px}
.warns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.w{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 12px;border-radius:15px;font-size:13px;font-weight:600;text-align:left}
.w.warn{background:var(--warnBg);color:var(--warnText)}.w.bad{background:var(--badBg);color:var(--badText)}.w.tip{background:var(--tipBg);color:var(--tipText)}
.w.ok{background:transparent;color:var(--good);padding-left:0}
.tplchip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--accent);min-height:32px}
.sec-t{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.6px;padding:0 4px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-t span{text-transform:none;letter-spacing:0;font-weight:500}
.dl{position:relative}
.row{position:relative;transition:transform .18s ease}
.row.drag{z-index:5;transition:none}
.row.drag .num{box-shadow:var(--lift)}
.num{display:flex;align-items:center;gap:12px;padding:12px 6px 12px 14px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);width:100%}
.num .ix{width:24px;font-size:15px;font-weight:700;color:var(--sec);text-align:center;flex:none}
.num .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sec);flex-wrap:wrap;min-width:0}
.meta .emo{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.emo{padding:2px 8px;border-radius:8px;color:#1C1C1E;font-weight:600;font-size:12px;white-space:nowrap}
.dots{letter-spacing:1.5px;color:var(--text);font-size:11px}
.flash{color:var(--accent);font-weight:700}
.hd{width:44px;height:44px;display:flex;align-items:center;justify-content:center;touch-action:none;color:var(--sec);flex:none}
.gap{display:flex;align-items:center;gap:10px;width:100%;min-height:30px;padding:2px 0 2px 26px}
.gap i{width:1.5px;align-self:stretch;background:var(--sep);min-height:26px}
.gap span{font-size:12.5px;color:var(--accent);font-weight:500}
.gap span.t{color:var(--sec);font-style:italic;font-weight:400}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:16px;border:1.5px dashed var(--accent);color:var(--accent);font-weight:600;width:100%;margin-top:12px;font-size:15px}
.empty{text-align:center;color:var(--sec);padding:40px 20px;font-size:15px;line-height:22px}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.split{display:block}
.side{display:none}
@media (min-width:860px){
  .split{display:flex;gap:24px;max-width:1100px;margin:0 auto;padding:0 24px}
  .split .wrap{flex:1;max-width:none;padding:0}
  .side{display:block;width:320px;flex:none}
  .side .card{padding:12px;margin-top:8px}
}
.qa{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border-radius:12px}
.qa+.qa{border-top:1px solid var(--sep)}
.qa .d{width:10px;height:10px;border-radius:5px;flex:none}
.qa .t{flex:1;min-width:0}
.qa .t b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa .t small{font-size:12px;color:var(--sec);white-space:nowrap}
.qa .plus{color:var(--accent);font-size:22px;font-weight:400;width:28px;text-align:center}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--field);color:var(--sec);margin-bottom:12px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep);font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);box-shadow:none;font-weight:600}
.grid>*{min-width:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rc{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:132px;text-align:left;width:100%;min-width:0;overflow:hidden}
.rc .top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.rc .top .emo{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rc .top span:last-child{font-size:12.5px;color:var(--sec);font-weight:500;flex:none}
.rc .ttl{font-size:15.5px;font-weight:600;line-height:20px;flex:1;overflow-wrap:anywhere}
.rc .bot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sec);gap:6px;min-width:0}
.rc .bot span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.rc .bot .dots{flex:none;letter-spacing:.5px;font-size:10px}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border-bottom:1px solid var(--sep);text-align:left}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .tx b{font-size:16px;font-weight:400}
.li .tx small{font-size:12.5px;color:var(--sec)}
.chk{flex:none;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--sec);transition:background .2s}
.chk.on{background:var(--good);box-shadow:none}
.badge{padding:3px 9px;border-radius:9px;background:var(--warnBg);color:var(--warnText);font-size:12px;font-weight:600;white-space:nowrap}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.sc{padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;position:relative}
.sc .n{font-size:18px;font-weight:700}
.sc .m{font-size:13px;color:var(--sec)}
.sc.cur{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.sc .more{position:absolute;top:8px;right:8px}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sb));padding:6px 8px var(--sb);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--sep);z-index:20}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sec);font-size:10.5px;font-weight:500}
#tabs button.on{color:var(--accent);font-weight:600}
/* sheet */
#dim{position:fixed;inset:0;background:var(--dim);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#dim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(100% - var(--st) - 24px);background:var(--sheet);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
#sheet.on{transform:none}
#sheet .grab{display:flex;justify-content:center;padding-top:8px;flex:none}
#sheet .grab i{width:38px;height:5px;border-radius:3px;background:var(--sep)}
.sh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 16px 6px;min-height:48px;flex:none}
.sh .t{font-size:16px;font-weight:600;text-align:center}
.sh .a{min-height:44px;color:var(--accent);font-size:16px}
.sh .a.r{justify-self:end;font-weight:600}
#sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(28px + var(--sb));flex:1}
.f{display:flex;flex-direction:column;gap:20px}
.fl{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.6px;padding-left:4px;margin-bottom:8px;display:flex;justify-content:space-between}
.fl span{text-transform:none;letter-spacing:0;font-weight:500}
.fg{background:var(--card);border-radius:14px;overflow:hidden}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:50px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--sep)}
.fr:last-child{border-bottom:0}
.fr>span{font-size:16px}
.fr input[type=text],.fr input[type=number],.fr input[type=tel],.fr input[type=email],.fr input[type=password],.fr select{-webkit-appearance:none;appearance:none;border:0;background:transparent;outline:none;flex:1;min-width:0}
.fr input.name{font-size:17px;font-weight:600}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:10px;background:var(--field);font-size:20px;text-align:center}
.step b{min-width:58px;text-align:center;font-size:16px}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.ec{height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:600;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep)}
.ec i{width:10px;height:10px;border-radius:5px}
.ec.on{box-shadow:none;color:#1C1C1E}
.tc{height:34px;padding:0 13px;border-radius:17px;font-size:14px;font-weight:600;background:var(--card);box-shadow:inset 0 0 0 1px var(--sep)}
.tc.on{background:var(--accent);color:var(--onAccent);box-shadow:none}
.pots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pots button{height:44px;border-radius:12px;background:var(--field);color:var(--sec);font-size:16px;font-weight:700;text-align:center}
.pots button.on{background:var(--accent);color:var(--onAccent)}
.seg{display:grid;gap:4px;padding:3px;border-radius:11px;background:var(--field)}
.seg button{height:34px;border-radius:8px;font-size:13.5px;font-weight:600;text-align:center;padding:0 4px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tg{position:relative;width:51px;height:31px;border-radius:16px;background:var(--track);flex:none;transition:background .2s}
.tg i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:left .2s}
.tg.on{background:var(--good)}.tg.on i{left:22px}
.mat{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--sep)}
.mat:last-child{border-bottom:0}
.mat .r1{display:flex;gap:8px;align-items:center}
.mat .r1 input{flex:1;min-width:0;border:0;background:var(--field);border-radius:10px;height:38px;padding:0 10px;outline:none}
.mat .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--sec)}
.mat .r2 .seg{flex:1;min-width:200px}
.mat .r2 input{width:64px;border:0;background:var(--field);border-radius:8px;height:32px;padding:0 8px;outline:none}
.x{width:32px;height:32px;border-radius:16px;background:var(--field);color:var(--sec);font-size:18px;text-align:center;flex:none}
textarea{width:100%;min-height:90px;border:0;border-radius:14px;background:var(--card);padding:12px 14px;outline:none;resize:vertical}
.danger{color:var(--badText);font-weight:600;text-align:center;width:100%;min-height:50px;background:var(--card);border-radius:14px}
.act{display:flex;flex-direction:column;gap:10px}
.act button{min-height:52px;border-radius:14px;background:var(--card);font-size:16px;font-weight:500;text-align:center}
.act button.d{color:var(--badText)}
.pal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:12px 14px}
.pal button{aspect-ratio:1;border-radius:50%}
.pal button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)}
.accs{display:flex;gap:12px;padding:12px 14px;flex-wrap:wrap}
.accs button{width:34px;height:34px;border-radius:17px}
.accs button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--text)}
.wi{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.wi .wt{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:15px}
.wi p{font-size:14px;color:var(--sec);line-height:20px}
.wi .mute{align-self:flex-start;font-size:13.5px;color:var(--accent);font-weight:600;min-height:32px}
.tpl{background:var(--card);border-radius:14px;padding:14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.tpl.on{box-shadow:inset 0 0 0 2px var(--accent)}
.tpl .tt{flex:1}
.tpl .tt b{font-size:16px;display:block}
.tpl .tt small{font-size:12.5px;color:var(--sec);display:block;margin-top:3px;line-height:17px}
#toast{position:fixed;left:50%;bottom:calc(80px + var(--sb));transform:translate(-50%,20px);background:#2A2A30;color:#fff;border-radius:14px;padding:10px 10px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#A8B2FF;font-weight:700;padding:6px 8px}
.guide{padding:4px 16px 16px;font-size:15px;line-height:22px;-webkit-user-select:text;user-select:text}
.guide p{margin-top:10px}.guide ul{margin:10px 0 0 20px}.guide li{margin-top:6px}.guide b{font-weight:600}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:opacity .45s ease}
#splash img{width:116px;height:116px;border-radius:26px;box-shadow:0 12px 34px rgba(0,0,0,.18);margin-bottom:14px}
#splash b{font-size:32px;font-weight:800;letter-spacing:-.6px}#splash span{font-size:16px;color:var(--sec)}
#splash .sig{position:absolute;bottom:calc(26px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--sec)}#splash .sig small{font-size:11.5px;letter-spacing:.3px}#splash .firma{width:84px;height:38px;color:var(--sec);opacity:.85}
.sig2{display:flex;flex-direction:column;align-items:center;gap:3px;padding:18px 0 4px;color:var(--sec);font-size:12px}.sig2 .firma{width:96px;height:43px;opacity:.7;margin-bottom:4px}
#splash.off{opacity:0;pointer-events:none}
.note{font-size:13px;color:var(--sec);line-height:19px;padding:6px 4px 0}
/* ---- ideas ---- */
.wrap.ide{padding-bottom:100px}
#fab{position:fixed;right:18px;bottom:calc(80px + var(--sb));width:56px;height:56px;border-radius:28px;background:var(--accent);color:var(--onAccent);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.25);z-index:30}
#fab:active{transform:scale(.94)}
@media (min-width:860px){#fab{right:calc(50% - 380px + 18px)}}
.chev{color:var(--sec);font-size:20px;flex:none}
.inbox{display:flex;align-items:center;gap:12px;width:100%;padding:14px;margin-bottom:6px;text-align:left}
.inbox .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.inbox .tx b{font-size:16px}.inbox .tx small{font-size:12.5px;color:var(--sec)}
.ib{width:36px;height:36px;border-radius:18px;background:var(--accent);color:var(--onAccent);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ib.z{background:var(--field);color:var(--sec)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fold{padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:96px;min-width:0}
.fold i{width:26px;height:20px;border-radius:5px;margin-bottom:6px}
.fold b{font-size:15.5px;overflow-wrap:anywhere}.fold small{font-size:12.5px;color:var(--sec)}
.fdot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
.nt{padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.ntb{text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.nmeta{font-size:12px;color:var(--sec)}

/* ============ asistente (reglas) ============ */
function rulesFor(show){
  const W=[];const off=D.set.off;const on=k=>!off[k];
  const add=(id,sev,t,why,k)=>W.push({id,key:id+':'+(k==null?'':k),sev,t,why});
  if(show.tpl==='coctel'){ if(on('coctel'))cocktailRules(show,add); return finish(W,show); }
  const L=resolve(show.items),n=L.length; if(!n)return [];
  const em=x=>emoOf(x.emo).n;
  if(on('open')&&D.set.universal){
    const f=L[0];
    if(f.dur>D.set.openMax)add('open','warn',`La apertura dura ${fmt(f.dur)}`,`Tu flash de presentación debería durar como máximo ${fmt(D.set.openMax)}, para que en los primeros segundos el público sepa quién eres.`,'d');
    if(!f.pres)add('open','warn','La apertura no es de presentación',`«${f.name}» no está marcado como número de presentación. Abre con un flash que te dé a conocer en los primeros 30 segundos.`,'p');
    if(!D.nums.some(x=>x.pres))add('open','tip','No tienes números de presentación','Marca en tu repertorio algún flash corto como «Número de presentación» para abrir tus shows.','r');
  }
  if(on('emo3')){let i=0;while(i<n){let j=i;while(j+1<n&&L[j+1].emo===L[i].emo)j++;if(j-i>=2)add('emo3','warn',`${j-i+1} de ${em(L[i]).toLowerCase()} seguidos`,`Los números ${i+1} a ${j+1} transmiten la misma emoción. Intercala otra para que el público no se acostumbre.`,i);i=j+1}}
  if(on('tipo2'))for(let i=0;i<n-1;i++){const c=L[i].tipos.filter(t=>L[i+1].tipos.indexOf(t)>=0);if(c.length)add('tipo2','warn',`Dos «${c[0]}» seguidas`,`«${L[i].name}» y «${L[i+1].name}» comparten tipo de efecto: el segundo pierde fuerza. Sepáralos.`,i)}
  if(on('weak2'))for(let i=0;i<n-1;i++)if(L[i].pot<=2&&L[i+1].pot<=2)add('weak2','warn','Dos números flojos seguidos',`«${L[i].name}» y «${L[i+1].name}» tienen potencia baja. Mete algo fuerte entre ellos.`,i);
  if(on('flat')&&show.tpl!=='kisho')for(let i=0;i<n-2;i++)if(L[i].pot===L[i+1].pot&&L[i+1].pot===L[i+2].pot){add('flat','tip','Curva plana',`Los números ${i+1} a ${i+3} tienen la misma potencia. Un cambio de ritmo ayuda a mantener la atención.`,i);break}
  if(on('vols'))for(let i=0;i<n-1;i++)if(L[i].sube&&L[i+1].sube)add('vols','warn','Voluntarios seguidos',`«${L[i].name}» y «${L[i+1].name}» suben gente al escenario. El ritmo se para: reparte los voluntarios.`,i);
  if(on('time')&&show.target){const t=totalDur(L)/60,g=show.target;
    if(t>g*1.1)add('time','bad',`${Math.round(t-g)} min por encima del objetivo`,`El show dura ${Math.round(t)} min y el objetivo es ${g}. Pasa algún número a reserva o elige versiones más cortas.`);
    else if(t<g*.85)add('time','tip',`Faltan ${Math.round(g-t)} min`,`El show dura ${Math.round(t)} min y el objetivo es ${g}. Añade algún número.`);}
  const maxP=Math.max.apply(null,L.map(x=>x.pot)),last=L[n-1];
  if(on('close')&&n>1&&['crescendo','tresactos','heroe','libre'].indexOf(show.tpl)>=0&&last.pot<maxP){const best=L.find(x=>x.pot===maxP);add('close','warn','El cierre no es el más fuerte',`Cierras con «${last.name}» (potencia ${last.pot}). Prueba a terminar con «${best.name}».`)}
  if(on('tpl'))tplRules(show,L,add);
  return finish(W,show);
}
function tplRules(show,L,add){
  const n=L.length,t=show.tpl;
  if(t==='crescendo'){
    const s=L[0].pres?1:0;
    for(let i=s;i<n-1;i++)if(L[i].pot-L[i+1].pot>1)add('tpl','warn','Bajón brusco',`Entre «${L[i].name}» y «${L[i+1].name}» la potencia cae ${L[i].pot-L[i+1].pot} puntos. En crescendo la energía no debería caer de golpe.`,'d'+i);
    if(L[s]&&L[s].pot<4&&n>2)add('tpl','tip','Apertura floja',`Tras la presentación, «${L[s].name}» debería ser de los fuertes (potencia 4–5).`,'o');
  }
  if(t==='tresactos'&&n>=3){
    const a=[[0,Math.round(n/3)],[Math.round(n/3),Math.round(2*n/3)],[Math.round(2*n/3),n]];
    a.forEach((r,k)=>{const seg=L.slice(r[0],r[1]);if(seg.length>1&&seg[seg.length-1].pot<seg[0].pot)add('tpl','warn',`El acto ${k+1} termina a la baja`,`Cada acto debería terminar más arriba de como empieza. El acto ${k+1} empieza en potencia ${seg[0].pot} y acaba en ${seg[seg.length-1].pot}.`,'a'+k)});
  }
  if(t==='freytag'&&n>=3){
    const mx=Math.max.apply(null,L.map(x=>x.pot));let p=-1;L.forEach((x,i)=>{if(x.pot===mx)p=i});
    const pos=p/(n-1);
    if(pos<.45)add('tpl','warn','El clímax llega pronto',`Tu número más fuerte está en la posición ${p+1} de ${n}. En esta plantilla el gran momento va hacia el 60–70 % del show.`,'p');
    if(n-1-p>2)add('tpl','warn',`Tras el clímax quedan ${n-1-p} números`,'Después del punto de no retorno conviene acelerar hacia un final decidido, con pocos números.','a');
    L.slice(p+1).forEach((x,i)=>{if(x.dur>360)add('tpl','tip','Número largo tras el clímax',`«${x.name}» dura ${fmt(x.dur)}. Tras el clímax el ritmo debería acelerar.`,'l'+i)});
  }
  if(t==='heroe'&&n>=3){
    const mid=L.slice(Math.floor(n/3),Math.ceil(2*n/3));
    if(!mid.some(x=>x.pot<=2||norm(emoOf(x.emo).n)==='tension'))add('tpl','warn','Falta la prueba','En el centro del show debería haber un momento de riesgo, tensión o aparente fallo: el héroe tiene que caer antes de renacer.','t');
    if(['emocion','ternura','asombro'].indexOf(norm(emoOf(L[n-1].emo).n))<0)add('tpl','tip','Cierre sin transformación','El final de un viaje del héroe funciona mejor con emoción, ternura o asombro que solo con risa.','c');
  }
  if(t==='kisho'&&n>=2){
    const end=L.slice(-2);
    if(!end.some(x=>x.tipos.some(k=>REVEAL.indexOf(k)>=0)))add('tpl','warn','Falta el giro final','El penúltimo o el último número debería ser una predicción, coincidencia o revelación que dé sentido a todo lo anterior.','g');
  }
}
function cocktailRules(show,add){
  const A=resolve(show.sets.A),B=resolve(show.sets.B),X=resolve(show.sets.X);
  [['A',A],['B',B],['X',X]].forEach(([k,L])=>{
    const nm=k==='X'?'set extendido':'set '+k;
    if(!L.length){if(k==='A')add('coctel','tip','El set A está vacío','Monta tu set principal: gancho, conexión y cierre.','eA');return}
    const d=totalDur(L);
    if(k!=='X'&&L.length>3)add('coctel','tip',`El ${nm} tiene ${L.length} números`,'En cóctel lo habitual son 2–3 números por grupo.','c'+k);
    if(k!=='X'&&d>600)add('coctel','warn',`El ${nm} dura ${fmt(d)}`,'Un mini-set de cóctel debería durar entre 5 y 10 minutos por grupo.','d'+k);
    const sf=k==='A'?'':' ('+nm+')';
    L.forEach((x,i)=>{
      if(x.dur>180)add('coctel','warn',`«${x.name}» dura ${fmt(x.dur)}${sf}`,'En cóctel cada número debería durar 3 minutos como máximo: no hay tiempo para rodeos.','l'+k+i);
      if(x.pot<4)add('coctel','warn',`«${x.name}» es de potencia ${x.pot}${sf}`,'En cóctel tienen que ser números rompedores, de potencia 4 o 5.','p'+k+i);
      if(!x.rodeado)add('coctel','warn',`«${x.name}» no aguanta rodeado${sf}`,'En cóctel el público suele estar alrededor tuyo.','r'+k+i);
      if(x.reset==='esconder')add('coctel','warn',`«${x.name}» necesita esconderse${sf}`,'Entre grupos no hay tiempo de preparar: busca números de reset inmediato.','s'+k+i);
      if(!x.limpio)add('coctel','tip',`«${x.name}» no termina limpio`,'Lo ideal es poder irte al siguiente grupo nada más acabar.','c'+k+i);
      if(x.sujetar)add('coctel','tip',`«${x.name}» pide sujetar cosas`,'La gente suele tener una copa en la mano.','h'+k+i);
      if(x.mat.some(m=>m.where==='maleta'))add('coctel','tip',`«${x.name}» lleva material de maleta`,'En cóctel conviene que todo quepa en los bolsillos.','m'+k+i);
    });
    if(L[0].dur>120)add('coctel','tip',`El gancho del ${nm} es largo`,'El primer número debe ser rápido y visual: sirve de termómetro para saber si el grupo quiere más.','g'+k);
    if(D.set.universal&&!D.set.off.open&&k==='A'&&!L[0].pres)add('coctel','tip','El gancho no es de presentación','Tu primer número para cada grupo es tu carta de presentación: márcalo como número de presentación.','pA');
  });
  if(B.length){const rep=B.filter(x=>A.some(y=>y.id===x.id));if(rep.length)add('coctel','warn','El set B repite números del A',`«${rep[0].name}» está en los dos sets. El B es para quien ya te ha visto.`,'rep')}
}
function finish(W,show){const m=show.muted||[];const order={bad:0,warn:1,tip:2};return W.filter(w=>m.indexOf(w.key)<0).sort((a,b)=>order[a.sev]-order[b.sev])}

/* ============ curva ============ */
function curveSVG(L,w,h,tpl,small){
  const pad=small?4:10,n=L.length;
  const X=i=>n<2?w/2:pad+i*((w-2*pad)/(n-1)),Y=p=>h-(small?4:8)-((p-1)/4)*(h-(small?10:22));
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">`;
  if(!small)s+=`<line x1="0" y1="${h-2}" x2="${w}" y2="${h-2}" stroke="var(--sep)"/>`;
  const T=TPL[tpl];
  if(T&&T.ideal&&!small){let d='';for(let k=0;k<=40;k++){const t=k/40;d+=(k?'L':'M')+(pad+t*(w-2*pad)).toFixed(1)+' '+Y(T.ideal(t)).toFixed(1)}s+=`<path d="${d}" fill="none" stroke="var(--sec)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>`}
  if(n){
    const P=L.map((x,i)=>({x:X(i),y:Y(x.pot)}));let d='M'+P[0].x+' '+P[0].y;
    for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];d+=` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)} ${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)} ${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`}
    if(n>1)s+=`<path d="${d} L${P[n-1].x} ${h-2} L${P[0].x} ${h-2}Z" fill="var(--accent)" fill-opacity=".08"/>`;
    s+=`<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="${small?2:2.5}" stroke-linecap="round"/>`;
    if(!small)P.forEach((p,i)=>{s+=`<circle cx="${p.x}" cy="${p.y}" r="7" fill="${emoOf(L[i].emo).c}" stroke="var(--card)" stroke-width="3"/>`;if(L[i].pres&&i===0)s+=`<path d="M${p.x} ${p.y-17} q0 5 5 5 q-5 0 -5 5 q0 -5 -5 -5 q5 0 5 -5z" fill="var(--accent)"/>`});
  }
  return s+'</svg>';

function repMatch(x){
  if(repF==='pres'&&!x.pres)return false;
  if(repF==='coctel'&&!(x.rodeado&&x.dur<=180&&x.pot>=4))return false;
  if(repF==='rodeado'&&!x.rodeado)return false;
  if(repF==='sinmesa'&&x.mesa)return false;
  if(repF.indexOf('e:')===0&&x.emo!==repF.slice(2))return false;
  if(!repQ)return true;
  const q=norm(repQ);
  return [x.name,emoOf(x.emo).n,x.tipos.join(' '),x.mat.map(m=>m.name).join(' '),x.notes].some(t=>norm(t).indexOf(q)>=0);
}

function enableDrag(list,onDrop){
  list.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.hd');if(!h||e.button>0)return;
    const row=h.closest('.row'),rows=$$('.row',list),from=rows.indexOf(row);if(from<0)return;
    e.preventDefault();try{h.setPointerCapture(e.pointerId)}catch(_){}
    const rects=rows.map(r=>r.getBoundingClientRect()),H=rects[from].height,y0=e.clientY;let to=from;
    row.classList.add('drag');
    const move=ev=>{const dy=ev.clientY-y0;row.style.transform=`translateY(${dy}px) scale(1.02)`;
      const c=rects[from].top+H/2+dy;to=0;rows.forEach((r,i)=>{if(i!==from&&c>rects[i].top+rects[i].height/2)to++});
      rows.forEach((r,i)=>{if(i===from)return;let sh=0;if(from<to&&i>from&&i<=to)sh=-H;if(from>to&&i>=to&&i<from)sh=H;r.style.transform=sh?`translateY(${sh}px)`:''})};
    const up=()=>{h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);rows.forEach(r=>r.style.transform='');row.classList.remove('drag');if(to!==from)onDrop(from,to)};
    h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}

/* ---- Material ---- */
function matList(s){
  const nums=s.tpl==='coctel'?resolve(s.sets.A.concat(s.sets.B,s.sets.X)):resolve(s.items);
  const map={},seen={};
  nums.forEach(x=>{if(seen[x.id])return;seen[x.id]=1;x.mat.forEach(m=>{if(!m.name.trim())return;const k=norm(m.name);
    if(!map[k])map[k]={k,name:m.name.trim(),where:m.where,cons:m.cons,stock:m.stock,para:[]};
    const o=map[k];o.para.push(x.name);if(m.cons)o.cons=true;if(m.stock!==''&&m.stock!=null)o.stock=m.stock})});
  return Object.keys(map).map(k=>map[k]);
}
function renderMat(){
  const el=$('#v-mat'),s=curShow();
  if(!s){keepScroll(el,`<div class="wrap">${hdr('')}<h1>Material</h1><div class="empty"><b>Sin show</b>Crea un show para ver su lista de material.</div></div>`);return}
  const L=matList(s),ch=s.checks||{};const done=L.filter(m=>ch[m.k]).length,tot=L.length;
  const circ=2*Math.PI*27,fr=tot?done/tot:0;
  let groups='';
  Object.keys(WHERE).forEach(w=>{const g=L.filter(m=>m.where===w);if(!g.length)return;
    groups+=`<div class="sec-t">${WHERE[w]} <span>${g.filter(m=>ch[m.k]).length} de ${g.length}</span></div><div class="group">${g.map(m=>{const on=!!ch[m.k];
      const low=m.cons?(m.stock!==''&&m.stock!=null&&+m.stock<=3?`<span class="badge">Quedan ${m.stock}</span>`:'<span class="badge">Consumible</span>'):'';
      return `<button class="li" data-a="check" data-k="${esc(m.k)}"><span class="chk${on?' on':''}">${on?ICON.check:''}</span><span class="tx"><b style="${on?'color:var(--sec);text-decoration:line-through':''}">${esc(m.name)}</b><small>${esc(m.para.join(' · '))}</small></span>${low}</button>`}).join('')}</div>`});
  keepScroll(el,`<div class="wrap">${hdr(esc(s.name)+' · '+(s.tpl==='coctel'?'cóctel':resolve(s.items).length+' números'),tot?'<button class="link" data-a="resetChecks" style="min-height:44px">Reiniciar</button>':'')}
   <div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px;margin-bottom:4px"><h1 style="padding:0;margin:0">Material</h1>
   ${tot?`<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${done} de ${tot} preparados"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--track)" stroke-width="6"/><circle cx="32" cy="32" r="27" fill="none" stroke="${done===tot?'var(--good)':'var(--accent)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(circ*fr).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 32 32)" style="transition:stroke-dasharray .35s"/></svg><b>${done}/${tot}</b></div>`:''}</div>
   ${tot?groups:'<div class="empty"><b>Nada que preparar</b>Los números de este show no tienen material apuntado en sus fichas.</div>'}</div>`);
}

function exportData(){
  const d=new Date(),name=`bambalinas-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Copia de Bambalinas'}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Copia descargada');
}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(err){toast('El archivo no es una copia válida');return}
    if(!o||!Array.isArray(o.nums)||!Array.isArray(o.shows)){toast('El archivo no es una copia de Bambalinas');return}
    openSheet({title:'Importar copia',body:()=>`<div class="note" style="padding:0 4px 12px">La copia tiene ${o.nums.length} números y ${o.shows.length} shows${o.ideas?', '+((o.ideas.notes||[]).length)+' notas, '+((o.ideas.ses||[]).length)+' sesiones de taller y '+((o.ideas.projs||[]).length)+' proyectos':''}.</div><div class="act"><button data-a="impMerge">Añadir a lo que ya tengo</button><button class="d" data-a="impReplace">Reemplazar todo</button></div>`});
    S.impMerge=()=>{mergeInto(o);save();closeSheet();toast('Copia añadida')};
    S.impReplace=()=>{closeSheet();withUndo('Copia restaurada',()=>{const d=defaults();o.set=Object.assign(d.set,o.set||{});D=Object.assign(d,o)})};
  };r.readAsText(f)});

const GUIDE=[
 ['Qué es Bambalinas','<p>Bambalinas te ayuda a montar, preparar y revisar tus shows de magia. Guardas cada número en una ficha, los colocas en orden como si fueran post-its y la app te enseña la curva de energía del show, te avisa de lo que un director te diría en un ensayo y te prepara la lista de material.</p><p>Todo se guarda en tu dispositivo y funciona sin internet.</p>'],
 ['Repertorio: tus fichas','<p>Cada número tiene su ficha. Lo más importante es que sea realista, porque el asistente trabaja con estos datos:</p><ul><li><b>Duración</b> en minutos y segundos.</li><li><b>Emoción</b> principal que transmite. Puedes crear las tuyas y elegir su color en Ajustes.</li><li><b>Potencia</b> del 1 (suave) al 5 (demoledora): cuánto impacta en el público.</li><li><b>Tipo de efecto</b>: puedes marcar varios, y crear los tuyos.</li><li><b>Público</b>: voluntarios, si suben al escenario y si es un número de presentación.</li><li><b>Condiciones</b>: si aguanta público rodeando, si necesita mesa o música, si termina limpio y si pide al público sujetar cosas.</li><li><b>Reset</b>: cuánto tardas en tenerlo listo otra vez.</li><li><b>Material</b>: dónde va (maleta, bolsillo o mesa) y si es consumible, con las unidades que te quedan.</li></ul><p>Usa el buscador y los filtros para encontrar números rápido. «Apto cóctel» muestra los que aguantan rodeado, duran 3 minutos o menos y tienen potencia 4 o 5.</p>'],
 ['Montar un show','<ul><li><b>Añadir:</b> pulsa «Añadir número» y elige de tu repertorio. En el iPad en horizontal tienes el repertorio a la derecha: tócalo para añadir.</li><li><b>Ordenar:</b> mantén el dedo en el icono ≡ de la derecha y arrastra.</li><li><b>Opciones de un número:</b> toca su nombre para editar la ficha, añadir una transición o quitarlo del show.</li><li><b>Transiciones:</b> entre número y número toca «+ transición» y apunta la frase puente, el chiste o el cambio de música.</li><li><b>La curva:</b> cada punto es un número, su altura es la potencia y su color la emoción. La línea gris discontinua es la curva ideal de la plantilla elegida.</li><li><b>El asistente:</b> bajo la curva aparecen los avisos más importantes. Tócalos para leer la explicación. Si algo lo haces a propósito, ocúltalo solo para ese show.</li></ul><p>Los colores de los avisos: rojo es importante, naranja es para revisar y gris es una sugerencia.</p>'],
 ['Material y shows','<p><b>Material</b> junta automáticamente el material de todos los números del show, sin repetidos y agrupado por maleta, bolsillo y mesa. Ve marcando lo que metes al hacer la maleta. «Reiniciar» deja la lista en blanco para el próximo bolo.</p><p><b>Shows</b> guarda todos tus shows. Toca uno para abrirlo en Montar. Con «···» puedes cambiar nombre, duración objetivo y plantilla, duplicarlo o eliminarlo. Si eliminas algo por error, pulsa «Deshacer» en el aviso que aparece abajo.</p>'],
 ['Bolos y cuentas','<p>En <b>Shows → Bolos</b> apuntas cada actuación: cliente, fecha, lugar, evento y show. Al terminar, valora cada número y la app irá calculando su potencia real.</p><p><b>Dinero de cada bolo:</b> abre el bolo y pulsa «Caché y forma de cobro».</p><ul><li><b>Factura:</b> pones la base, el IVA y la retención de IRPF. La app calcula el total, lo que te ingresan y lo que te queda de verdad (sin el IVA, que es de Hacienda).</li><li><b>Cooperativa:</b> lo que factura la cooperativa menos su comisión. Si ya sabes lo que te pagan, pon la comisión a 0.</li><li><b>Sin factura:</b> el importe y cómo te pagaron.</li></ul><p>Marca si está cobrado y cuándo. En «Gastos» apuntas a mano la gasolina, peajes, parking, dietas, material… El beneficio del bolo es lo que te queda menos los gastos.</p><p><b>Cuentas:</b> el resumen del mes o del año, lo pendiente de cobrar, los gastos por tipo y los <b>gastos generales</b> que no van con un bolo (material nuevo, web, formación…), que pueden repetirse cada mes. Puedes exportarlo a una hoja de cálculo.</p><p>En Ajustes → Cuentas eliges el IVA, el IRPF y la comisión por defecto, puedes <b>ocultar los importes</b> cuando enseñes la app, o apagar las cuentas si no las necesitas.</p>'],
 ['Ideas: notas, taller y proyectos','<p><b>Notas rápidas:</b> pulsa el botón del lápiz en la pestaña Ideas y apunta en dos segundos (también puedes dictar con el micrófono del teclado). Si no eliges carpeta, la nota va a «Sin ordenar»; desde ahí la mandas a su carpeta con un toque. Las carpetas las creas tú, con su nombre y su color.</p><p><b>Taller:</b> tu método creativo en seis pasos.</p><ul><li><b>Objetos:</b> los que quieras, o al azar.</li><li><b>Análisis morfológico:</b> físico, sensorial y función y contexto, más atributos libres.</li><li><b>Inversión:</b> la app te propone el contrario de cada atributo cuando lo conoce; cámbialo y marca con ✦ los que te sugieran algo.</li><li><b>Preposiciones:</b> combina los objetos por parejas en los dos sentidos. Marca con estrella las buenas y baraja para verlas de otra forma.</li><li><b>Árbol:</b> el mapa mental de cada objeto, en vista de ramas (cómoda en el iPhone) o de pizarra (arrastra y pellizca).</li><li><b>Hoja:</b> todo lo que ha salido en una sola página. Con «Limpiar» vas tachando lo que no tiene sentido (también se puede en cada paso); lo tachado se queda a la vista, salvo en el árbol. Con «Unir» eliges 2 o 3 conceptos, también tachados, y apuntas lo que sale. Al final, tus hipótesis fantásticas y tus conexiones.</li></ul><p><b>Proyectos:</b> las ideas que quieres convertir en número, en cuatro fases: idea, en desarrollo, ensayando y estrenado. Apunta qué falta y cuántas veces lo has ensayado. Al estrenarlo se crea su ficha en el Repertorio.</p>'],
 ['Ajustes y copias','<ul><li><b>Apariencia:</b> automático (sigue al dispositivo), claro u oscuro, y el color de acento.</li><li><b>Emociones y tipos propios:</b> créalos, renómbralos y elige colores.</li><li><b>Asistente:</b> activa o desactiva cada regla y ajusta la duración máxima de tu flash.</li><li><b>Copia de seguridad:</b> «Exportar copia» crea un archivo con todo. Guárdalo en Google Drive. «Importar copia» lo recupera en otro dispositivo, o añade el repertorio de un amigo al tuyo.</li></ul><p>Cada dispositivo guarda sus propios datos: para tener lo mismo en el iPhone y en el iPad, exporta en uno e importa en el otro.</p>'],
 ['Teoría: la regla de presentación','<p>El público se forma una impresión de alguien en muy pocos segundos, y lo primero que ve pesa más en cómo recuerda todo lo demás. Por eso la app propone abrir siempre con un <b>flash corto</b> (1:30 como máximo, ajustable) marcado como <b>número de presentación</b>: algo que en los primeros 30 segundos deje claro quién eres, aunque alguien tenga que irse pronto.</p><p>Se aplica a todas las plantillas y se puede desactivar.</p>'],
 ['Teoría: Crescendo constante','<p><b>Origen:</b> Darwin Ortiz, en <i>Strong Magic</i> (1994), uno de los libros de referencia sobre cómo presentar magia. Organiza el acto en apertura, construcción y cierre, y defiende que el show debe ir siempre a más, equilibrando unidad (un hilo común) y variedad.</p><p><b>Curva ideal:</b> una rampa que sube de principio a fin.</p><p><b>Qué comprueba la app:</b> que el cierre sea tu número más fuerte, que la potencia no caiga más de un punto de golpe entre dos números y que, tras la presentación, abras con algo fuerte.</p><p><b>Ideal para:</b> close-up, salón y bolos cortos.</p>'],
 ['Teoría: Tres actos','<p><b>Origen:</b> Dariel Fitzkee, en <i>Showmanship for Magicians</i> (1943), aplicando a la magia la estructura clásica del teatro. Un primer acto que presenta y sube el interés, un segundo que lo complica y un tercero que lo lleva todo a un clímax. Fitzkee proponía planificar empezando por el gran final y trabajar hacia atrás.</p><p><b>Curva ideal:</b> tres escalones, cada uno terminando más arriba.</p><p><b>Qué comprueba la app:</b> divide el show en tres bloques y avisa si alguno termina más flojo de lo que empieza, y si el cierre no es tu número más fuerte.</p><p><b>Ideal para:</b> espectáculos de escenario de 45 a 90 minutos.</p>'],
 ['Teoría: Pirámide de Freytag','<p><b>Origen:</b> Gustav Freytag, dramaturgo alemán, describió en 1863 la estructura en cinco partes del drama clásico: introducción, acción ascendente, clímax, acción descendente y desenlace. El director de magia Will Given la ha trasladado a los espectáculos de magia.</p><p><b>Curva ideal:</b> una montaña con el pico hacia el 60–70 % del show.</p><p><b>Qué comprueba la app:</b> que el clímax (tu número más fuerte) no llegue demasiado pronto, que después queden pocos números y que no sean largos, para acelerar hacia un final decidido.</p><p><b>Ideal para:</b> shows con un número estrella que lo cambia todo.</p>'],
 ['Teoría: Viaje del héroe','<p><b>Origen:</b> Joseph Campbell describió en 1949 una estructura que se repite en mitos de todo el mundo: partida, iniciación y regreso. En magia la han usado escuelas como la de Jeff McBride para construir espectáculos con historia.</p><p><b>Curva ideal:</b> sube, cae en una prueba en el centro y renace hacia el final.</p><p><b>Qué comprueba la app:</b> que en el centro haya un momento de riesgo o tensión (potencia baja o emoción de tensión) y que el cierre sea de transformación: emoción, ternura o asombro.</p><p><b>Ideal para:</b> shows temáticos o teatrales.</p>'],
 ['Teoría: Kishōtenketsu','<p><b>Origen:</b> estructura en cuatro partes nacida en la poesía clásica china y muy usada en Japón: introducción, desarrollo, giro y conclusión. Su giro no es un conflicto, sino algo inesperado que da un sentido nuevo a todo lo anterior. No viene de un libro de magia: es una adaptación pensada para el mentalismo.</p><p><b>Curva ideal:</b> tranquila durante casi todo el show y un salto final.</p><p><b>Qué comprueba la app:</b> que el penúltimo o el último número sea una predicción, coincidencia, lectura de mente o revelación. No avisa de curvas planas.</p><p><b>Ideal para:</b> mentalismo y shows de «todo estaba predicho».</p>'],
 ['Teoría: Magia de cóctel','<p><b>Origen:</b> la práctica de los magos que trabajan de grupo en grupo en bodas, cócteles y eventos. No hay un único show, sino un mini-set que repites con cada grupo.</p><ul><li><b>Gancho:</b> rápido y visual. Te sirve de termómetro para saber si el grupo quiere más.</li><li><b>Conexión:</b> interacción y personalidad.</li><li><b>Cierre:</b> fuerte y memorable.</li></ul><p>El <b>set B</b> es para grupos que repiten o ya te han visto, y el <b>extendido</b> para los más entregados.</p><p><b>Qué comprueba la app:</b> sets de 5 a 10 minutos y de 2 o 3 números, cada número de 3 minutos como máximo, potencia 4 o 5, que aguante público rodeando, reset inmediato, que termine limpio, que no pida sujetar cosas, material de bolsillo y que el set B no repita números del A.</p>'],
 ['Teoría: los tipos de efecto','<p>La lista de tipos reúne las clasificaciones clásicas de efectos mágicos, como la de Fitzkee, junto con las categorías habituales del mentalismo, agrupadas en cinco familias: con objetos, leyes físicas, mente, el espectador y otros.</p><p>Sirven para que el asistente detecte cuándo pones dos efectos iguales seguidos (el segundo pierde fuerza) y para saber qué números sirven como giro final. Si echas en falta alguno, créalo en Ajustes → Tus tipos de efecto.</p>'],
 ['Plantilla libre','<p>Solo aplica las reglas generales (emociones, tipos y voluntarios seguidos, números flojos, curva plana, duración y cierre), sin curva ideal. Para cuando quieres total libertad.</p>']
];

function prevNote(){

    <div class="act"><button data-a="evalBolo" style="color:var(--accent);font-weight:600">${b.eval?'Editar valoración':'Valorar actuación'}</button><button data-a="editBolo">Datos del bolo</button><button class="d" data-a="delBolo">Eliminar bolo</button></div></div>`}});
  S.editBolo=()=>{BF=clone(b);boloForm()};

function evalForm(b){

  else E={general:0,energia:0,cambiar:'',items:boloNums(b).map(n=>({nid:n.id,name:n.name,rate:0,fallo:false,nota:''}))};

    <div class="note" style="padding:0 4px">${esc(b.cliente||'Bolo')} · ${fdate(b.date)}. Valora cómo reaccionó el público a cada número: 1 flojo, 5 demoledor.</div>
    ${E.items.length?E.items.map((i,k)=>`<div class="fg" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-size:16px;min-width:0;overflow-wrap:anywhere">${esc(i.name)}</b><span style="color:var(--sec);font-size:13px;flex:none">${i.rate?RATE[i.rate-1]:'Sin valorar'}</span></div>
      ${scale(i.rate,'evRate','data-k="'+k+'"')}
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><span style="font-size:15px">Hubo algún fallo</span>${tg(i.fallo,'evFallo','data-k="'+k+'"')}</div>
      <input type="text" placeholder="Nota (opcional)" value="${esc(i.nota)}" data-in="E.nota" data-k="${k}" style="border:0;background:var(--field);border-radius:10px;height:40px;padding:0 12px;outline:none;width:100%"></div>`).join('')
      :'<div class="note">Este bolo no tiene show asignado o el show está vacío. Puedes valorar igualmente el show en general.</div>'}
    <div><div class="fl">Valoración del show <span>${E.general?RATE[E.general-1]:''}</span></div>${scale(E.general,'evGen')}</div>
    <div><div class="fl">Energía de la sala <span>${E.energia?RATE[E.energia-1]:''}</span></div>${scale(E.energia,'evEn')}</div>
    <div><div class="fl">Qué cambiarías</div><textarea placeholder="Lo que mejorarías la próxima vez…" data-in="E.cambiar">${esc(E.cambiar)}</textarea></div></div>`});

/* ============ cuentas (dinero de cada bolo + contabilidad mensual) ============ */
const CTA=()=>{const d={on:true,hide:false,iva:21,irpf:15,coop:12,modo:'factura'};if(!D.set.cta)D.set.cta=d;else for(const k in d)if(!(k in D.set.cta))D.set.cta[k]=d[k];return D.set.cta};
if(!Array.isArray(D.gastos))D.gastos=[];
const GCB=[['gasolina','⛽','Gasolina','#8DBDEB'],['peajes','🛣️','Peajes','#95D9BD'],['parking','🅿️','Parking','#F2D27A'],['dietas','🍽️','Dietas','#F5B48A'],['material','🃏','Material','#B39BE6'],['ayudante','🧑‍🤝‍🧑','Ayudante','#F2B1CB'],['alojamiento','🏨','Alojamiento','#9FB4F2'],['otro','•••','Otro','#B8BEC9']];
const GCG=[['material','🃏','Material','#B39BE6'],['web','🌐','Web','#8DD3E0'],['formacion','🎓','Formación','#A8D59A'],['vestuario','👔','Vestuario','#E6A3A3'],['publicidad','📣','Publicidad','#F29B8D'],['coche','🚗','Coche','#C9B28F'],['telefono','📱','Teléfono','#9FB4F2'],['otro','•••','Otro','#B8BEC9']];
const gcat=(k,gen)=>(gen?GCG:GCB).find(c=>c[0]===k)||GCG.concat(GCB).find(c=>c[0]===k)||GCB[7];
const MODOS=[['factura','Factura'],['coop','Cooperativa'],['sin','Sin factura']];
const PAGOS=[['efectivo','Efectivo'],['bizum','Bizum'],['transf','Transf.']];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let SHOWMNY=false;
function pnum(v){if(typeof v==='number')return isFinite(v)?v:0;let s=String(v||'').trim().replace(/\s|€/g,'');if(!s)return 0;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0}
function eurTxt(x){const neg=x<0;x=Math.round(Math.abs(x)*100)/100;let [i,d]=x.toFixed(2).split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−':'')+i+(d==='00'?'':','+d)+' €'}
function eur(x){return CTA().hide&&!SHOWMNY?'<span class="mny" data-a="reveal" title="Toca para ver">•••</span>':eurTxt(x)}
const numIn=v=>v===''||v==null?'':String(v).replace('.',',');
function calc(b){const c=b.cobro,g=(b.gastos||[]).reduce((a,x)=>a+pnum(x.imp),0);
  if(!c||!c.modo)return {set:false,gastos:g,queda:0,benef:-g};
  let r={set:true,modo:c.modo,gastos:g};
  if(c.modo==='factura'){const base=pnum(c.base),iva=base*pnum(c.iva)/100,irpf=base*pnum(c.irpf)/100;Object.assign(r,{base,iva,irpf,total:base+iva,ingresan:base+iva-irpf,queda:base-irpf})}
  else if(c.modo==='coop'){const br=pnum(c.bruto),com=br*pnum(c.com)/100;Object.assign(r,{bruto:br,com,ingresan:br-com,queda:br-com})}
  else{const im=pnum(c.imp);Object.assign(r,{ingresan:im,queda:im})}
  if(c.rep){const tq=r.queda,mine=c.parteModo==='imp'?pnum(c.parte):tq*pnum(c.parte==null||c.parte===''?50:c.parte)/100,ratio=tq?mine/tq:0;r.totalQueda=tq;r.otros=tq-mine;r.queda=mine;r.ingresan=r.ingresan*ratio}
  r.benef=r.queda-g;return r}
const ym=s=>(s||'').slice(0,7);
const ymOf=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
function genFor(key){return D.gastos.filter(g=>{const s=ym(g.date);if(!g.rep)return s===key;return s<=key&&(!g.until||key<g.until)})}
function monthStats(key){const B=D.bolos.filter(b=>ym(b.date)===key&&b.date<=todayStr()||ym(b.date)===key&&b.cobro&&b.cobro.modo);
  let ing=0,gb=0,byModo={factura:0,coop:0,sin:0},cats={},fac={base:0,iva:0,irpf:0};
  B.forEach(b=>{const r=calc(b);if(r.set){ing+=r.queda;byModo[r.modo]+=r.queda;if(r.modo==='factura'){fac.base+=r.base;fac.iva+=r.iva;fac.irpf+=r.irpf}}gb+=r.gastos;(b.gastos||[]).forEach(x=>{cats[x.cat]=(cats[x.cat]||0)+pnum(x.imp)})});
  const G=genFor(key),gg=G.reduce((a,x)=>a+pnum(x.imp),0);G.forEach(x=>{cats[x.cat]=(cats[x.cat]||0)+pnum(x.imp)});
  return {B,G,ing,gastos:gb+gg,benef:ing-gb-gg,byModo,cats,fac}}
function unclosed(){const t=todayStr();return D.bolos.filter(b=>b.date&&b.date<t&&!calc(b).set).sort((a,b)=>b.date.localeCompare(a.date))}
function pendientes(){return D.bolos.filter(b=>{const r=calc(b);return r.set&&!b.cobro.cobrado&&(b.date||'')<=todayStr()}).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function cobroPill(b){const r=calc(b);if(!r.set)return '';const n=(MODOS.find(m=>m[0]===r.modo)||['',''])[1];return `<span class="pl ${b.cobro.cobrado?'ok':'wa'}">${n} · ${b.cobro.cobrado?'cobrado':'pendiente'}</span>`}

/* ---- tarjetas y lista de bolos ---- */
function boloCard(b,t){const d=(b.date||'').split('-'),on=CTA().on,r=calc(b),past=b.date&&b.date<t;
  const val=on&&past&&!r.set?'<span class="pl wa">Falta el dinero</span>':!b.eval&&past&&!b.otro?'<span class="pl wa">Por valorar</span>':(b.eval?`<span class="pl ok">${RATE[(b.eval.general||3)-1]}</span>`:'<span class="pl pd">Por hacer</span>');
  return `<button class="card bc" data-a="openBolo" data-id="${b.id}"><div class="bd"><b>${d[2]?+d[2]:'—'}</b><small>${d[1]?['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][+d[1]-1]:''}</small></div>
  <div class="bt"><b>${esc(b.cliente||'Sin cliente')}</b><small>${esc(b.showName||'Sin show')}${b.con?' · con '+esc(b.con):''} · ${esc(evName(b.evento))}${b.hora?' · '+esc(b.hora):''}</small>
  <div class="bm"><span class="pls">${on?cobroPill(b):''}${val}</span>${on?(r.set?`<span class="mo">${eur(r.benef)}</span>`:'<span class="mo sec">Sin cobro</span>'):''}</div></div></button>`}
function bolosHTML(){
  const q=norm(BQ),t=todayStr(),on=CTA().on;
  const L=D.bolos.filter(b=>!q||[b.cliente,b.contacto,b.lugar,b.direccion,b.showName,evName(b.evento)].some(x=>norm(x).indexOf(q)>=0));
  if(!D.bolos.length)return '<div class="empty"><b>Aún no hay bolos</b>Apunta cada actuación con los datos del cliente, el caché y los gastos. Al terminar, valora cómo fue cada número: con el tiempo la app sabrá qué números funcionan de verdad y cuánto te deja cada show.</div>';
  const up=L.filter(b=>(b.date||'')>t).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const past=L.filter(b=>!((b.date||'')>t)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const U=on&&!q?unclosed().filter(b=>!b.luego):[];let h='';
  if(U.length){const b=U[0],ay=(new Date(Date.now()-864e5)).toISOString().slice(0,10)===b.date;
    h+=`<div class="card nudge"><b>¿Qué tal ${ay?'ayer':'el '+fdate(b.date)} en ${esc(b.lugar||b.cliente||'el bolo')}?</b><span>${b.showName?esc(b.showName)+(b.con?' con '+esc(b.con):'')+'. ':''}Cierra el bolo apuntando el dinero y los gastos.${U.length>1?' Tienes '+U.length+' bolos sin cerrar.':''}</span>
    <div class="nbtn"><button class="pill" data-a="nudgeCobro" data-id="${b.id}">Caché</button><button class="pill ghost" data-a="nudgeGastos" data-id="${b.id}">Gastos</button><button class="pill ghost lat" data-a="nudgeLater" data-id="${b.id}">Luego</button></div></div>`}
  h+=`<label class="search">${ICON.search}<input type="search" placeholder="Buscar cliente, lugar o show" value="${esc(BQ)}" data-in="BQ" aria-label="Buscar bolos"></label>`;
  if(up.length)h+=`<div class="sec-t">Próximos <span>${up.length}</span></div>`+up.map(b=>boloCard(b,t)).join('');
  const groups={};past.forEach(b=>{const k=ym(b.date)||'sin';(groups[k]=groups[k]||[]).push(b)});
  Object.keys(groups).sort().reverse().forEach(k=>{const arr=groups[k],ben=arr.reduce((a,b)=>a+calc(b).benef,0),p=k.split('-');
    h+=`<div class="sec-t">${k==='sin'?'Sin fecha':MESES[+p[1]-1][0].toUpperCase()+MESES[+p[1]-1].slice(1)+' '+p[0]} <span>${on&&arr.some(b=>calc(b).set)?'Beneficio '+eur(ben):pl(arr.length,'bolo','bolos')}</span></div>`+arr.map(b=>boloCard(b,t)).join('')});
  if(!up.length&&!past.length)h+='<div class="empty"><b>Nada coincide</b>Prueba con otra búsqueda.</div>';
  if(on)h+='<div class="note">El importe de cada bolo es su beneficio: lo que te queda menos lo que te ha costado.</div>';
  return h}
function moneyCard(b){if(!CTA().on)return '';const r=calc(b);
  if(!r.set&&b.date&&b.date<=todayStr())return `<div class="card nudge"><b>Este bolo ya ha pasado</b><span>Apunta el caché y lo que te costó para que entre en tus cuentas.</span><div class="nbtn"><button class="pill" data-a="cobroForm">Caché y cobro</button><button class="pill ghost" data-a="gastosBolo">Gastos${r.gastos?' ('+eurTxt(r.gastos)+')':''}</button></div></div>`;
  if(!r.set&&!r.gastos)return `<div><div class="fl">Dinero del bolo</div><div class="act"><button data-a="cobroForm" style="color:var(--accent);font-weight:600">Apuntar caché y forma de cobro</button><button data-a="gastosBolo">Gastos</button></div></div>`;
  const tot=Math.max(r.queda,0)+r.gastos,pg=tot?Math.round(Math.max(r.queda-r.gastos,0)/tot*100):0;
  return `<div class="card money"><div class="mrow big2"><span>Beneficio del bolo</span><b class="${r.benef>=0?'good':'bad'}">${eur(r.benef)}</b></div>
   <div class="mbar"><i style="width:${pg}%"></i><em style="width:${100-pg}%"></em></div>
   <div class="mrow"><span>Te queda del caché</span><b>${r.set?eur(r.queda):'—'}</b></div><div class="mrow"><span>Gastos</span><b>${eur(-r.gastos)}</b></div>
   ${r.set?`<div class="mrow sm"><span>${(MODOS.find(m=>m[0]===r.modo)||['',''])[1]}${b.cobro.cobrado&&b.cobro.fcobro?' · cobrado el '+fdate(b.cobro.fcobro):''}</span>${cobroPill(b)}</div>`:''}</div>
   <div><div class="fl">Dinero del bolo</div><div class="act"><button data-a="cobroForm" style="color:var(--accent);font-weight:600">Caché y forma de cobro</button><button data-a="gastosBolo">Gastos${(b.gastos||[]).length?' ('+b.gastos.length+')':''}</button></div></div>`}

/* ---- caché y cobro ---- */
let CB=null,CBB=null;
function cobroForm(b){CBB=b;const st=CTA();CB=b.cobro?clone(b.cobro):{rep:!!b.con,parteModo:'pct',parte:50,modo:st.modo,base:'',iva:st.iva,irpf:st.irpf,nfac:'',bruto:'',com:st.coop,coopNom:'',imp:'',pago:'efectivo',cobrado:false,fcobro:''};
  openSheet({title:'Caché y cobro',left:'Cancelar',cancelA:'backBolo',right:'Guardar',rightA:'cbSave',body:()=>{const m=CB.modo;
    const nf=(k,l,ph,suf)=>`<div class="fr"><span>${l}</span><label class="nin"><input type="text" inputmode="decimal" value="${esc(numIn(CB[k]))}" placeholder="${ph||'0'}" data-in="CB" data-k="${k}">${suf||'€'}</label></div>`;
    const tf=(k,l,ph)=>`<div class="fr"><span>${l}</span><input type="text" value="${esc(CB[k]||'')}" placeholder="${ph}" data-in="CB" data-k="${k}" class="tin"></div>`;
    let f='';
    if(m==='factura')f=`<div class="fg">${nf('base','Base (sin IVA)')}${nf('iva','IVA','21','%')}${nf('irpf','Retención IRPF','15','%')}</div><div class="card brk" id="brk">${brkHTML()}</div><div class="fg">${tf('nfac','Nº de factura','Opcional')}</div>`;
    else if(m==='coop')f=`<div class="fg">${nf('bruto','Lo que factura la cooperativa')}${nf('com','Comisión y cuotas','12','%')}${tf('coopNom','Cooperativa','Nombre')}</div><div class="card brk" id="brk">${brkHTML()}</div><div class="note" style="margin-top:-8px">Si la cooperativa te dice directamente cuánto te paga, escribe ese importe y pon la comisión a 0.</div>`;

function exportCuentas(){const mes=CM.mode==='mes',keys=mes?[ymOf(CM.y,CM.m)]:Array.from({length:12},(_,i)=>ymOf(CM.y,i));
  const n=v=>(Math.round(v*100)/100).toFixed(2).replace('.',','),q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';

  keys.forEach(k=>{const s=monthStats(k);s.B.forEach(b=>{const r=calc(b),c=b.cobro||{};rows.push([b.date,'Bolo',b.cliente||'',evName(b.evento),r.set?MODOS.find(m=>m[0]===r.modo)[1]:'',r.base!=null?n(r.base):'',r.iva!=null?n(r.iva):'',r.irpf!=null?n(r.irpf):'',r.total!=null?n(r.total):'',r.set?n(r.ingresan):'',n(r.queda||0),n(r.gastos),n(r.benef),r.set?(c.cobrado?'Sí':'No'):'',c.modo==='factura'?c.nfac||'':c.modo==='coop'?c.coopNom||'':c.modo==='sin'?(PAGOS.find(p=>p[0]===c.pago)||['',''])[1]:''].map((v,i)=>i>=5&&i<=12?v:q(v)).join(';'));
      (b.gastos||[]).forEach(x=>rows.push([b.date,'Gasto del bolo',(gcat(x.cat)[2])+(x.nota?' · '+x.nota:'')+' ('+(b.cliente||'bolo')+')','','','','','','','','',n(pnum(x.imp)),n(-pnum(x.imp)),'',''].map((v,i)=>i>=5&&i<=12?v:q(v)).join(';')))});
    s.G.forEach(x=>rows.push([x.rep?k+'-01':x.date,'Gasto general',(x.concept||'')+' · '+gcat(x.cat,true)[2]+(x.rep?' (mensual)':''),'','','','','','','','',n(pnum(x.imp)),n(-pnum(x.imp)),'',''].map((v,i)=>i>=5&&i<=12?v:q(v)).join(';')))});

function antonym(v){v=String(v||'').trim();if(!v)return '';const low=v.toLowerCase();if(ANT[low])return cap(ANT[low],v);
  let hit=false;const out=v.replace(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+/g,w=>{const a=ANT[w.toLowerCase()];if(a){hit=true;return cap(a,w)}return w});return hit?out:''}
function cap(a,ref){return ref&&ref[0]===ref[0].toUpperCase()&&ref[0]!==ref[0].toLowerCase()?a[0].toUpperCase()+a.slice(1):a}

function relDate(ts){const d=new Date(ts),n=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(),diff=Math.round((day(n)-day(d))/864e5);
  if(diff===0)return 'Hoy · '+hm;if(diff===1)return 'Ayer · '+hm;return fdate(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))}

function invSources(o){const r=[];MORF.forEach(g=>g[1].forEach(f=>{const v=(o.m[f]||'').trim();if(v)r.push({k:'m:'+o.id+':'+f,v})}));o.attrs.forEach(a=>r.push({k:'a:'+a.id,v:a.t}));return r}
function invTo(o,k,v){const e=o.inv[k];return e&&e.to!=null?e.to:antonym(v)}
function prepList(a,b){const r=[];PREPS.forEach((p,i)=>{r.push({k:'p:'+a.id+':'+i+':'+b.id,l:a.n+' '+p+' '+lc(b.n),a:a.n,p,b:lc(b.n)});r.push({k:'p:'+b.id+':'+i+':'+a.id,l:b.n+' '+p+' '+lc(a.n),a:b.n,p,b:lc(a.n)})});return r}
const lc=s=>s?s[0].toLowerCase()+s.slice(1):s;
function pairsOf(s){const r=[];for(let i=0;i<s.objs.length;i++)for(let j=i+1;j<s.objs.length;j++)r.push([s.objs[i],s.objs[j]]);return r}
function treeOf(s,o){s.tree[o.id]=s.tree[o.id]||[];return s.tree[o.id]}
function hojaSecs(s){
  const secs=[];
  s.objs.forEach(o=>{const it=[];MORF.forEach(g=>g[1].forEach(f=>{const v=(o.m[f]||'').trim();if(v)it.push({id:'m:'+o.id+':'+f,l:v})}));o.attrs.forEach(a=>it.push({id:'a:'+a.id,l:a.t}));if(it.length)secs.push({t:'Análisis · '+o.n,items:it})});
  const inv=[];s.objs.forEach(o=>invSources(o).forEach(src=>{const to=invTo(o,src.k,src.v);if(to)inv.push({id:'i:'+src.k,l:src.v+' → '+to+((o.inv[src.k]||{}).lamp?' ✦':'')})}));
  if(inv.length)secs.push({t:'Inversiones',items:inv});
  const pr=[];let ptotal=0;pairsOf(s).forEach(([a,b])=>prepList(a,b).forEach(p=>{ptotal++;if(s.preps[p.k]||IV.allPreps)pr.push({id:p.k,l:p.l+(s.preps[p.k]?' ★':'')})}));
  if(ptotal)secs.push({t:'Preposiciones',right:IV.allPreps?'todas · <button class="link" data-a="allPreps">solo con estrella</button>':'con estrella · <button class="link" data-a="allPreps">ver las '+ptotal+'</button>',items:pr});
  const tr=[];let hid=0;s.objs.forEach(o=>treeOf(s,o).forEach(n=>{if(s.struck['t:'+n.id]&&!IV.hidT){hid++;return}tr.push({id:'t:'+n.id,l:n.t})}));
  if(tr.length||hid)secs.push({t:'Árbol',right:IV.hidT?'<button class="link" data-a="hidT">ocultar tachados</button>':(hid?'solo lo que queda · <button class="link" data-a="hidT">'+pl(hid,'tachado oculto','tachados ocultos')+'</button>':'solo lo que queda'),items:tr});
  return secs}
function labelOf(s,id){if(id.indexOf('h:')===0){const h=s.hyps.find(x=>'h:'+x.id===id);return h?h.t:''}
  const sv=[IV.allPreps,IV.hidT];IV.allPreps=true;IV.hidT=true;let l='';hojaSecs(s).some(sec=>sec.items.some(i=>{if(i.id===id){l=i.l.replace(/ [★✦]$/,'');return true}}));IV.allPreps=sv[0];IV.hidT=sv[1];return l}
function sesCounts(s){const sv=[IV.allPreps,IV.hidT];IV.allPreps=false;IV.hidT=true;let v=0,x=0;hojaSecs(s).forEach(sec=>sec.items.forEach(i=>{if(s.struck[i.id])x++;else v++}));
  s.hyps.forEach(h=>{if(s.struck['h:'+h.id])x++;else v++});IV.allPreps=sv[0];IV.hidT=sv[1];
  let st=Object.keys(s.preps).filter(k=>s.preps[k]).length;s.objs.forEach(o=>Object.keys(o.inv).forEach(k=>{if(o.inv[k].lamp)st++}));return {v,x,st}}

/* árbol */
function kids(nodes,p){return nodes.filter(n=>(n.p||null)===p)}
function stepTree(s){
  if(!s.objs.length)return '<div class="empty"><b>Sin objetos</b>Vuelve al paso 1.</div>';
  const o=s.objs[IV.oi]||s.objs[0],T=treeOf(s,o);
  let h=`<div class="seg tmode" style="grid-template-columns:repeat(2,minmax(0,1fr))">${[['ramas','Ramas'],['pizarra','Pizarra']].map(([k,n])=>`<button class="${IV.tmode===k?'on':''}" data-a="tmode" data-k="${k}">${n}</button>`).join('')}</div>`+objSel(s);
  if(IV.tmode==='ramas'){
    const row=(n,d)=>{const ch=kids(T,n.id),f=IV.fold[n.id];
      return `<div class="trw${s.struck['t:'+n.id]?' struck':''}" style="--d:${d}"><button class="tgl" data-a="tFold" data-id="${n.id}" aria-label="Plegar">${ch.length?(f?'▸':'▾'):''}</button><button class="tn" data-a="tNode" data-id="${n.id}">${esc(n.t)}${f&&ch.length?` <small>(${ch.length})</small>`:''}</button>${IV.clean?'':`<button class="tadd" data-a="tAdd" data-id="${n.id}" aria-label="Añadir rama">+</button>`}</div>`+(f?'':ch.map(c=>row(c,d+1)).join(''))};
    h+=`<div class="card tree"><div class="trw" style="--d:0"><span class="tgl">${T.length?'▾':''}</span><span class="tn root">${esc(o.n)}</span>${IV.clean?'':'<button class="tadd" data-a="tAdd" data-id="" aria-label="Añadir rama">+</button>'}</div>${kids(T,null).map(n=>row(n,1)).join('')}
      ${IV.clean?'':'<button class="trw newb" style="--d:1" data-a="tAdd" data-id=""><span class="tgl"></span>+ Nueva rama</button>'}</div>
      <div class="note">Toca + para sacar ramas a un concepto y ▾ para plegarlo. Toca un concepto para renombrarlo o borrarlo. Es el mismo árbol que la pizarra.</div>`;
  }else{
    const key=s.id+':'+o.id;if(TB.key!==key)TB={x:0,y:0,s:1,key};
    const pos=layoutTree(T);let lines='',nodes=`<button class="nd c" data-a="tAdd" data-id="" style="left:0;top:0">${esc(o.n)}</button>`;
    T.forEach(n=>{const a=pos[n.id],b=n.p?pos[n.p]:{x:0,y:0};if(!a)return;lines+=`<line x1="${b.x}" y1="${b.y}" x2="${a.x}" y2="${a.y}"/>`;
      const dep=a.d;nodes+=`<button class="nd${dep>1?' s':''}${s.struck['t:'+n.id]?' struck':''}" data-a="tNode" data-id="${n.id}" style="left:${a.x}px;top:${a.y}px">${esc(n.t)}</button>`});
    h+=`<div class="board" id="board"><div class="bin" id="bin"><svg class="blines" width="1" height="1">${lines}</svg>${nodes}</div>
      <div class="zoom"><button data-a="zoom" data-d="-1" aria-label="Alejar">−</button><b id="zpct">${Math.round(TB.s*100)}%</b><button data-a="zoom" data-d="1" aria-label="Acercar">+</button><button data-a="zoom" data-d="0" aria-label="Centrar">⌖</button></div></div>
      <div class="note">Arrastra con un dedo para moverte y pellizca para acercar. Toca el objeto central para sacarle ramas y cualquier concepto para ver sus opciones.</div>`;
  }

function layoutTree(T){const pos={},R=118;
  const leaves=id=>{const c=kids(T,id);return c.length?c.reduce((a,n)=>a+leaves(n.id),0):1};

    c.forEach(n=>{const span=(a1-a0)*leaves(n.id)/tot,mid=a+span/2,r=R*d+(d>1?(d-1)*12:0);pos[n.id]={x:Math.round(Math.cos(mid)*r),y:Math.round(Math.sin(mid)*r),d};place(n.id,a,a+span,d+1);a+=span})};
  place(null,-Math.PI/2,Math.PI*1.5,1);return pos}
function applyTB(){const b=$('#board'),i=$('#bin');if(!b||!i)return;i.style.transform=`translate(${b.clientWidth/2+TB.x}px,${b.clientHeight/2+TB.y}px) scale(${TB.s})`;const z=$('#zpct');if(z)z.textContent=Math.round(TB.s*100)+'%'}
function attachBoard(){const b=$('#board');if(!b)return;applyTB();const P=new Map();let st=null,pin=null,moved=false;
  const dist=()=>{const v=[...P.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)};
  b.addEventListener('pointerdown',e=>{if(e.target.closest('.zoom'))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1){st={x:e.clientX,y:e.clientY,tx:TB.x,ty:TB.y};moved=false}else if(P.size===2){pin={d:dist(),s:TB.s};st=null}});
  b.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size===1&&st){const dx=e.clientX-st.x,dy=e.clientY-st.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;if(moved){TB.x=st.tx+dx;TB.y=st.ty+dy;applyTB()}}
    else if(P.size===2&&pin){TB.s=Math.max(.35,Math.min(2.6,pin.s*dist()/pin.d));moved=true;applyTB()}});
  const up=e=>{P.delete(e.pointerId);pin=null;if(P.size===1){const v=[...P.values()][0];st={x:v.x,y:v.y,tx:TB.x,ty:TB.y}}else st=null};

  dirty(){if(!this.user||this.applying)return;this.meta.editT=Date.now();this.saveMeta();clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1500)},
  async push(force){if(!this.user)return;const fb=this.fb,u=this.user.uid;let n=0;
    try{for(const name of Object.keys(PARTS)){const j=partJSON(name),h=fnv(j);if(!force&&h===this.meta.last[name])continue;if(force&&h===this.meta.last[name])continue;
        if(j.length>950000){this.setStatus('error','Hay demasiados datos en «'+name+'» para guardarlos en la nube');continue}
        await fb.putPart(u,name,{j,t:Date.now(),dev:this.meta.dev});this.meta.last[name]=h;n++}
      this.saveMeta();this.lastOk=Date.now();this.setStatus('ok')}
    catch(e){this.setStatus('offline');clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),30000)}
    return n},
  async login(email,pass,create){const fb=await this.load();
    const cred=create?await fb.signUp(email,pass):await fb.signIn(email,pass);const user=cred.user?{uid:cred.user.uid,email:cred.user.email}:cred;
    this.loadMeta();const same=this.meta.uid===user.uid;this.meta.uid=user.uid;this.meta.email=user.email||email;if(!same)this.meta.last={};this.saveMeta();
    const remote=await fb.getParts(user.uid),names=Object.keys(remote).filter(n=>PARTS[n]&&remote[n]&&typeof remote[n].j==='string');
    this.user=user;
    if(!names.length){this.meta.last={};this.saveMeta();await this.push(true);this.connect();return 'subido'}
    if(!hasLocalData()||same){names.forEach(n=>{applyPart(n,remote[n].j);this.meta.last[n]=fnv(remote[n].j)});this.saveMeta();save(true);this.connect();return 'bajado'}
    this.pendingRemote=remote;return 'elegir'},
  async resolve(mode){const remote=this.pendingRemote;this.pendingRemote=null;
    const backup=JSON.stringify(D);try{localStorage.setItem('espatontos-antes-de-sincronizar',backup)}catch(e){}
    const mine=JSON.parse(backup);
    Object.keys(remote).forEach(n=>{if(PARTS[n]&&typeof remote[n].j==='string'){applyPart(n,remote[n].j);this.meta.last[n]=fnv(remote[n].j)}});
    if(mode==='juntar')mergeInto(mine);
    this.saveMeta();save(true);this.connect();if(mode==='juntar')this.push()},
  async logout(wipe){try{if(this.unsub)this.unsub()}catch(e){}this.unsub=null;try{await this.fb.signOut()}catch(e){}
    this.user=null;this.meta.uid=null;this.meta.email='';this.meta.last={};this.saveMeta();this.setStatus('off');
    if(wipe){const keep={tab:D.set.tab,seenGuide:true};D=defaults();Object.assign(D.set,keep);save(true)}},
  async deleteAll(){const u=this.user.uid;for(const n of Object.keys(PARTS)){await this.fb.delPart(u,n)}await this.fb.delUser();await this.logout(false)}
};
function authErr(e){const c=(e&&e.code)||'';return ({'auth/invalid-email':'El correo no es válido.','auth/missing-password':'Escribe la contraseña.','auth/weak-password':'La contraseña es demasiado corta: mínimo 6 caracteres.',
  'auth/email-already-in-use':'Ya existe una cuenta con ese correo. Pulsa «Entrar».','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.',
  'auth/user-not-found':'No hay ninguna cuenta con ese correo.','auth/too-many-requests':'Demasiados intentos. Espera un poco y vuelve a probar.','auth/network-request-failed':'No hay conexión a internet.',
  'auth/requires-recent-login':'Por seguridad, cierra sesión y vuelve a entrar antes de borrar la cuenta.'})[c]||'No se ha podido completar. '+(c?'('+c.replace('auth/','')+')':'Comprueba tu conexión.')}
let AU={email:'',pass:'',msg:'',busy:false};
function syncAgo(){if(!SYNC.lastOk)return '';const s=Math.round((Date.now()-SYNC.lastOk)/1000);return s<60?'hace un momento':s<3600?'hace '+Math.round(s/60)+' min':'hace '+Math.round(s/3600)+' h'}
function accountSettingsHTML(){if(!SYNC.enabled())return '';const m=SYNC.loadMeta();
  if(!m.uid)return `<div><div class="fl">Cuenta</div><div class="act"><button data-a="authOpen" style="color:var(--accent);font-weight:600">Iniciar sesión o crear cuenta</button></div><div class="note">Con una cuenta, tus datos se guardan en la nube y puedes abrirlos desde el iPhone, el iPad o cualquier otro dispositivo. Sin cuenta, todo sigue guardándose solo en este dispositivo.</div></div>`;
  const st={ok:'Sincronizado '+syncAgo(),syncing:'Sincronizando…',offline:'Sin conexión: se subirá en cuanto vuelva internet',error:SYNC.err||'Error al sincronizar',off:'Conectando…'}[SYNC.status]||'';
  return `<div><div class="fl">Cuenta</div><div class="fg"><div class="fr"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(m.email)}</span><span class="pl ${SYNC.status==='ok'?'ok':SYNC.status==='error'?'wa':'pd'}" style="flex:none">${SYNC.status==='ok'?'En la nube':SYNC.status==='offline'?'Sin conexión':SYNC.status==='error'?'Error':'…'}</span></div></div><div class="note">${esc(st)}</div>
   <div class="act" style="margin-top:10px"><button data-a="syncNow">Sincronizar ahora</button><button data-a="authOut">Cerrar sesión</button></div></div>`}
function authSheet(){AU.msg='';openSheet({title:'Tu cuenta',left:'Cancelar',body:()=>`<div class="f">
  <div class="note" style="padding:0 4px">Entra con tu cuenta o crea una nueva. Tus datos se guardarán en la nube y podrás abrirlos desde otros dispositivos.</div>
  <div class="fg"><div class="fr"><input type="email" inputmode="email" autocomplete="username" placeholder="Correo" value="${esc(AU.email)}" data-in="AU" data-k="email" aria-label="Correo"></div><div class="fr"><input type="password" autocomplete="current-password" placeholder="Contraseña (mínimo 6 caracteres)" value="${esc(AU.pass)}" data-in="AU" data-k="pass" aria-label="Contraseña" data-enter="authIn"></div></div>
  ${AU.msg?`<div class="note" style="color:${AU.ok?'var(--good)':'var(--badText)'};font-weight:600">${esc(AU.msg)}</div>`:''}
  <div class="act"><button data-a="authIn" style="background:var(--accent);color:var(--onAccent);font-weight:600">${AU.busy?'Un momento…':'Entrar'}</button><button data-a="authUp">Crear cuenta nueva</button></div>
  <button class="link" data-a="authReset" style="min-height:44px;align-self:center">He olvidado mi contraseña</button>
  <div class="note">Cada persona solo puede ver sus propios datos. Si cierras sesión, lo que hay en este dispositivo se queda aquí.</div></div>`})}
function chooseSheet(){openSheet({title:'Ya tienes datos en la nube',left:' ',cancelA:'noop',body:()=>`<div class="f">
  <div class="note" style="padding:0 4px">Esta cuenta ya tiene datos guardados y en este dispositivo también hay datos. ¿Qué hacemos?</div>
  <div class="act"><button data-a="syncJoin" style="color:var(--accent);font-weight:600">Juntar las dos cosas</button><button data-a="syncCloud">Usar solo lo de la nube</button></div>
  <div class="note">«Juntar» suma lo de los dos sitios sin perder nada. «Usar solo lo de la nube» sustituye lo de este dispositivo; por si acaso, guardo una copia de lo que había aquí.</div></div>`})}
async function authDo(kind){if(AU.busy)return;const e=(AU.email||'').trim(),p=AU.pass||'';
  if(kind==='reset'){if(!e){AU.msg='Escribe tu correo arriba y vuelve a pulsar.';AU.ok=false;drawSheet();return}
    try{AU.busy=true;drawSheet();await (await SYNC.load()).reset(e);AU.msg='Te hemos mandado un correo para cambiar la contraseña. Mira también en spam.';AU.ok=true}catch(err){AU.msg=authErr(err);AU.ok=false}AU.busy=false;drawSheet();return}
  if(!e||!p){AU.msg='Escribe tu correo y tu contraseña.';AU.ok=false;drawSheet();return}
  AU.busy=true;AU.msg='';drawSheet();
  try{const r=await SYNC.login(e,p,kind==='up');AU.busy=false;AU.pass='';
    if(r==='elegir'){chooseSheet();return}
    closeSheet();toast(r==='bajado'?'Sesión iniciada: datos descargados de la nube':'Sesión iniciada: tus datos ya están en la nube')}
  catch(err){AU.busy=false;AU.msg=authErr(err);AU.ok=false;drawSheet()}}
Object.assign(S,{
  noop:()=>{},
  authOpen:()=>authSheet(),
  authIn:()=>authDo('in'),authUp:()=>authDo('up'),authReset:()=>authDo('reset'),
  syncJoin:async()=>{await SYNC.resolve('juntar');closeSheet();toast('Datos juntados y guardados en la nube')},
  syncCloud:async()=>{await SYNC.resolve('nube');closeSheet();toast('Usando los datos de la nube')},
  syncNow:async()=>{SYNC.setStatus('syncing');await SYNC.push();toast(SYNC.status==='ok'?'Sincronizado':'Sin conexión: se subirá más tarde')},
  authOut:()=>openSheet({title:'Cerrar sesión',body:()=>`<div class="f"><div class="note" style="padding:0 4px">Tus datos siguen guardados en la nube. ¿Qué hacemos con lo que hay en este dispositivo?</div>
   <div class="act"><button data-a="outKeep">Dejarlos aquí</button><button class="d" data-a="outWipe">Borrarlos de este dispositivo</button></div>
   <div class="note">Borrarlos es útil si el dispositivo no es tuyo. Volverán al iniciar sesión otra vez.</div>
   <div class="act" style="margin-top:14px"><button class="d" data-a="delAccount">Eliminar mi cuenta y mis datos de la nube</button></div></div>`}),
  outKeep:async()=>{await SYNC.logout(false);closeSheet();toast('Sesión cerrada')},
  outWipe:async()=>{await SYNC.logout(true);closeSheet();toast('Sesión cerrada y datos borrados de este dispositivo')},
  delAccount:()=>openSheet({title:'Eliminar cuenta',body:()=>`<div class="f"><div class="note" style="padding:0 4px">Se borran tu cuenta y todos tus datos de la nube. Lo que hay en este dispositivo se queda aquí. No se puede deshacer.</div><div class="act"><button class="d" data-a="delAccountOk">Sí, eliminar mi cuenta</button><button data-a="closeSheet">Cancelar</button></div></div>`}),
  delAccountOk:async()=>{try{await SYNC.deleteAll();closeSheet();toast('Cuenta eliminada')}catch(e){closeSheet();toast(authErr(e))}}
});
