const DEF = { e2: 55, e4: 100, mp: 100, inc: true, iva: 10, irpf: 15, aviso: true, hora: 23 };
const FB_CONFIG = { apiKey: 'AIzaSyDXdrRm69cympP9-zd1MOl5lGfVWJVcCqo', authDomain: 'laura-8a65c.firebaseapp.com', projectId: 'laura-8a65c', storageBucket: 'laura-8a65c.firebasestorage.app', messagingSenderId: '710521295313', appId: '1:710521295313:web:f23fd7d248200f54d810f0' };

const eur = (n, dec) => (dec ? (Math.round(n * 100) / 100).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(n).toLocaleString('es-ES')) + ' €';

  const p = Object.assign({}, DEF, d.p || {});
  const elfo = d.e === 2 ? p.e2 : d.e === 4 ? p.e4 : 0;
  const n = d.m || 0, tot = n * p.mp;

  const base = prev || { e: null, pn: false, m: null, nota: '' };
  const nuevo = Object.assign({}, base, cambios, { p: (prev && prev.p) || pick(A(), ['e2', 'e4', 'mp', 'inc', 'iva', 'irpf']), t: Date.now() });

const pick = (o, ks) => ks.reduce((r, k) => (r[k] = o[k], r), {});

/* ---------- Sincronizar con la hoja ---------- */
let enviando = false, reintento = 0;
async function sincronizar() {
  if (!API.startsWith('https://') || !PIN) { S.sync = 'off'; return; }
  if (enviando) { reintento = 1; return; }
  if (!navigator.onLine) { S.sync = 'espera'; pintarEstado(); return; }
  enviando = true; reintento = 0;
  const lote = COLA.slice();
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: PIN, ops: lote }), redirect: 'follow' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    COLA = COLA.slice(lote.length); LS.set('cola', COLA);
    // Lo de la hoja manda; lo que se ha apuntado mientras tanto se vuelve a aplicar encima.
    D = Object.assign({ dias: {}, ajustes: {}, facturas: {}, nominas: {} }, j.datos);
    COLA.forEach(aplicar);

  } catch (e) {
    S.sync = 'error'; S.err = String(e.message || e);
    if (/código/i.test(S.err)) { PIN = ''; LS.set('pin', ''); }
  }
  enviando = false;
  pintar();
  if (reintento) sincronizar();
}
function aplicar(o) {
  if (o.t === 'dia') { if (o.d) D.dias[o.f] = o.d; else delete D.dias[o.f]; }
  else if (o.t === 'ajustes') D.ajustes = o.d;

function pintar() {
  const a = $('#app'), y = window.scrollY;
  const pant = { hoy: pHoy, cal: pCal, dia: pDia, cue: pCue, aju: pAju }[S.pant] || pHoy;
  const tabs = S.pant === 'dia' || S.pant === 'aju' ? '' : `<nav class="tabs" aria-label="Secciones">
    <button data-a="ir" data-v="hoy" class="${S.pant === 'hoy' ? 'on' : ''}">${IC.hoy}Hoy</button>
    <button data-a="ir" data-v="cal" class="${S.pant === 'cal' ? 'on' : ''}">${IC.cal}Calendario</button>
    <button data-a="ir" data-v="cue" class="${S.pant === 'cue' ? 'on' : ''}">${IC.cue}Cuentas</button></nav>`;
  a.innerHTML = `<main class="main">${pant()}</main>${tabs}${S.modal ? pModal() : ''}`;
  if (S.mantener) window.scrollTo(0, y); else window.scrollTo(0, 0);
  S.mantener = false;
  if (S.modal) { const i = $('.modal input'); i && setTimeout(() => i.focus(), 50); }
}
function pintarEstado() { const e = $('#estado'); if (e) e.outerHTML = estadoHTML(); }
function estadoHTML() {
  const pend = COLA.length;
  const [c, t] = !API.startsWith('https://') ? ['#B42318', 'La hoja aún no está conectada']
    : !PIN ? ['#B42318', 'Falta el código de la hoja (Ajustes)']
    : S.sync === 'error' ? ['#B42318', 'No se ha podido copiar a la hoja' + (pend ? ' · ' + pend + ' pendientes' : '')]
    : pend ? ['#C27A00', pend + ' cambio' + (pend > 1 ? 's' : '') + ' por copiar a la hoja']
    : S.sync === 'ok' ? ['#0B6E55', 'Copiado en la hoja'] : ['#9A9AA2', 'Conectando…'];
  return `<span class="estado" id="estado"><i style="background:${c}"></i>${t}</span>`;
}

/* ---- Hoy ---- */
function pHoy() {
  const k = hoyK(), d = D.dias[k], a = A();
  const eOn = v => d && d.e === v ? 'on' : '', mOn = v => d && d.m === v ? 'on' : '';
  const u = S.ultimo && S.ultimo.k === k && Date.now() < S.ultimo.hasta;
  const c = d ? calc(d) : null;
  const ym = mesDe(k), t = totales(x => mesDe(x) === ym);
  const q = trimestre(ym), tq = totales(x => x.slice(0, 4) === ym.slice(0, 4) && trimestre(mesDe(x)) === q);
  return `
  <div class="row">
    <div><div class="sub">${largo(k)}</div><h1>Hoy</h1></div>
    <button class="ico" data-a="ir" data-v="aju" aria-label="Ajustes">${IC.gear}</button>
  </div>
  ${avisosHTML()}
  <section class="blk e" aria-label="Elfo">
    <div class="rowb"><h2>Elfo</h2><span class="hint">¿Cuántos turnos hoy?</span></div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      <button class="opt txt ${eOn(0)}" data-a="e" data-v="0">Libre</button>
      <button class="opt ${eOn(2)}" data-a="e" data-v="2">2<small>${eur(a.e2)}</small></button>
      <button class="opt ${eOn(4)}" data-a="e" data-v="4">4<small>${eur(a.e4)}</small></button>
    </div>
    ${d && (d.e === 2 || d.e === 4) ? `<label class="pnrow"><span><span class="tag">PN</span>Hoy he sido Papá Noel</span><span class="sw"><input type="checkbox" data-a="pn" ${d.pn ? 'checked' : ''}><span></span></span></label>` : ''}
    ${u ? `<div class="saved"><span style="display:flex;align-items:center;gap:6px">${IC.ok}Guardado · ${eur(c.elfo + c.conIva)} hoy</span><button data-a="deshacer">Deshacer</button></div>` : ''}
  </section>
  <section class="blk m" aria-label="Mago">
    <div class="rowb"><h2>Mago</h2><span class="hint">${eur(a.mp)} por turno${a.iva ? ' · IVA ' + (a.inc ? 'incl.' : 'aparte') : ''}</span></div>
    <div class="grid" style="grid-template-columns:repeat(5,1fr)">
      <button class="opt txt ${mOn(0)}" data-a="m" data-v="0" style="height:50px">Nada</button>
      ${[1, 2, 3, 4].map(n => `<button class="opt ${mOn(n)}" data-a="m" data-v="${n}" style="height:50px">${n}</button>`).join('')}
    </div>
  </section>
  <section class="card">
    <div class="rowb"><span class="lab">${nomMes(ym)} hasta hoy</span><button class="lnk" data-a="ir" data-v="cue">Ver cuentas</button></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-size:13px;color:var(--elfo);font-weight:600">Elfo</div><div class="big">${eur(t.elfo)}</div><div style="font-size:12px;color:var(--mut)">${t.turnosE} turnos · netos</div></div>
      <div><div style="font-size:13px;color:var(--mago);font-weight:600">Mago</div><div class="big">${eur(t.tuyo)}</div><div style="font-size:12px;color:var(--mut)">${t.n} turnos · ${eur(t.conIva)} con IVA</div></div>
    </div>
    <div class="hr"></div>
    <div class="rowb"><span style="font-size:15px;font-weight:600">Te queda limpio</span><span class="huge">${eur(t.limpio)}</span></div>
    ${tq.iva ? `<div class="rowb" style="font-size:13px;color:var(--mut)"><span>IVA para apartar (${q}.º trimestre)</span><span style="font-weight:600;color:var(--ink)">${eur(tq.iva)}</span></div>` : ''}
  </section>
  ${estadoHTML()}`;
}
function avisosHTML() {
  const ch = [], hoy = hoyK(), mesHoy = mesDe(hoy);
  // días del contrato sin apuntar (hasta ayer)
  const faltan = [];
  for (let k = INICIO; k < hoy && k <= FIN; k = sumDias(k, 1)) if (!D.dias[k]) faltan.push(k);
  if (faltan.length === 1) ch.push(`<button class="chip" data-a="abrirDia" data-v="${faltan[0]}">Te falta apuntar el ${deClave(faltan[0]).getDate()} de ${MESES[deClave(faltan[0]).getMonth()]}</button>`);
  else if (faltan.length > 1) ch.push(`<button class="chip" data-a="ir" data-v="cal">Te faltan ${faltan.length} días por apuntar</button>`);
  const meses = [...new Set(Object.keys(D.dias).map(mesDe))].filter(m => m < mesHoy).sort();
  meses.forEach(m => {
    const t = totales(x => mesDe(x) === m), f = D.facturas[m] || {};
    if (t.n && !f.hecha) ch.push(`<button class="chip" data-a="verMes" data-v="${m}">Factura de ${nomMes(m)} sin hacer</button>`);
    else if (t.n && !f.cobrada) ch.push(`<button class="chip" data-a="verMes" data-v="${m}">Factura de ${nomMes(m)} sin cobrar</button>`);
    if (t.elfo && D.nominas[m] == null) ch.push(`<button class="chip" data-a="verMes" data-v="${m}">Nómina de ${nomMes(m)} sin apuntar</button>`);
  });
  return ch.length ? `<div class="chips">${ch.join('')}</div>` : '';
}

/* ---- Calendario ---- */
function pCal() {
  const ym = S.mesCal || mesDe(hoyK()), [y, m] = ym.split('-').map(Number);
  const prim = new Date(y, m - 1, 1), hueco = (prim.getDay() + 6) % 7, nd = new Date(y, m, 0).getDate(), hoy = hoyK();
  let celdas = '';
  for (let i = 0; i < hueco; i++) celdas += '<span></span>';
  for (let i = 1; i <= nd; i++) {
    const k = ym + '-' + pad(i), d = D.dias[k];
    const falta = !d && k >= INICIO && k < hoy && k <= FIN;
    const b = d ? (d.e ? `<span class="b e ${d.pn ? 'pn' : ''}">${d.e}</span>` : '') + (d.m ? `<span class="b m">${d.m}</span>` : '') + (!d.e && !d.m ? '<span style="font-size:10px;color:var(--mut)">libre</span>' : '') : '';
    const desc = largo(k) + (d ? ((d.e ? ', elfo ' + d.e + ' turnos' + (d.pn ? ' de Papá Noel' : '') : '') + (d.m ? ', mago ' + d.m + ' turnos' : '') + (!d.e && !d.m ? ', libre' : '')) : falta ? ', sin apuntar' : '');
    celdas += `<button class="dia ${k > hoy ? 'fut' : ''} ${k === hoy ? 'hoy' : ''} ${falta ? 'falta' : ''}" data-a="abrirDia" data-v="${k}" aria-label="${esc(desc)}"><span class="n">${i}</span><span class="bdg">${b}</span></button>`;
  }
  const t = totales(x => mesDe(x) === ym);
  return `
  <div class="row">
    <h1>${nomMes(ym)[0].toUpperCase() + nomMes(ym).slice(1)}${y !== new Date().getFullYear() ? ' ' + y : ''}</h1>
    <div style="display:flex;gap:8px"><button class="ico" data-a="mesCal" data-v="-1" aria-label="Mes anterior">${IC.izq}</button><button class="ico" data-a="mesCal" data-v="1" aria-label="Mes siguiente">${IC.der}</button></div>
  </div>
  <section class="card" style="padding:14px 8px">
    <div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<span class="h">${x}</span>`).join('')}${celdas}</div>
  </section>
  <div class="leg">
    <span><span class="b e">4</span>Turnos de elfo</span>
    <span><span class="b e pn" style="box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--pn)">2</span>Con aro: Papá Noel</span>
    <span><span class="b m">1</span>Turnos de mago</span>
    <span><span style="width:14px;height:14px;border-radius:4px;background:#FDF3EA;border:1px solid #F0C9A6"></span>Sin apuntar</span>
  </div>
  <section class="card">
    <div class="li"><span>Días de elfo</span><span>${t.diasE} (${t.turnosE} turnos)</span></div>
    <div class="li"><span>De Papá Noel</span><span>${t.pn} día${t.pn === 1 ? '' : 's'}</span></div>
    <div class="li"><span>Turnos de mago</span><span>${t.n}</span></div>
  </section>
  <p class="note">Toca un día para apuntarlo o cambiarlo.</p>`;
}

/* ---- Editar un día ---- */
function pDia() {
  const k = S.dia, b = S.borr, a = Object.assign({}, A(), (D.dias[k] && D.dias[k].p) || {});
  const eB = v => `optL e ${b.e === v ? 'on' : ''}`, mB = v => `optL m ${b.m === v ? 'on' : ''}`;
  const tmp = calc(Object.assign({}, b, { p: a }));
  const partes = [];
  if (tmp.elfo) partes.push(eur(tmp.elfo) + ' de elfo');
  if (tmp.n) partes.push(eur(tmp.conIva) + ' de mago');
  return `
  <button class="back" data-a="ir" data-v="cal">${IC.izq}Calendario</button>
  <h1 style="font-size:30px">${largo(k)}</h1>
  ${!D.dias[k] ? '<p class="note" style="margin:0">Este día está sin apuntar.</p>' : ''}
  <section class="card">
    <span class="disp" style="font-size:18px;font-weight:700;color:var(--elfo)">Elfo</span>
    <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      <button class="${eB(0)} txt" data-a="be" data-v="0">Libre</button>
      <button class="${eB(2)}" data-a="be" data-v="2">2<small>${eur(a.e2)}</small></button>
      <button class="${eB(4)}" data-a="be" data-v="4">4<small>${eur(a.e4)}</small></button>
    </div>
    ${b.e === 2 || b.e === 4 ? `<label class="row" style="min-height:46px;background:#FBEDEB;border-radius:12px;padding:0 12px;font-size:15px;font-weight:600;color:#8C1C13">Hice de Papá Noel<span class="sw"><input type="checkbox" data-a="bpn" ${b.pn ? 'checked' : ''}><span></span></span></label>` : ''}
  </section>
  <section class="card">
    <div class="rowb"><span class="disp" style="font-size:18px;font-weight:700;color:var(--mago)">Mago</span><span style="font-size:13px;color:var(--mut)">${eur(a.mp)} por turno</span></div>
    <div class="grid" style="grid-template-columns:repeat(5,1fr)">
      <button class="${mB(0)} txt" data-a="bm" data-v="0">Nada</button>
      ${[1, 2, 3, 4].map(n => `<button class="${mB(n)}" data-a="bm" data-v="${n}">${n}</button>`).join('')}
    </div>
  </section>
  <div class="form"><div class="f"><label for="nota" style="color:var(--mut)">Nota</label><input id="nota" type="text" placeholder="Opcional" value="${esc(b.nota)}" style="width:72%;text-align:left;font-weight:500" data-a="bnota"></div></div>
  <div class="rowb" style="padding:0 4px"><span style="font-size:15px;color:var(--mut)">Este día</span><span class="disp" style="font-size:20px;font-weight:700">${partes.join(' + ') || '—'}</span></div>
  <button class="prim" data-a="guardarDia">Guardar</button>
  ${D.dias[k] ? '<button class="del" data-a="borrarDia">Borrar este día</button>' : ''}`;
}

/* ---- Cuentas ---- */
function pCue() {
  const hoy = hoyK();
  const meses = [...new Set(Object.keys(D.dias).map(mesDe).concat([mesDe(hoy)]))].sort();
  const sel = S.mes && (S.mes === 'total' || meses.includes(S.mes)) ? S.mes : mesDe(hoy);
  S.mes = sel;
  const filtro = sel === 'total' ? () => true : x => mesDe(x) === sel;
  const t = totales(filtro), a = A();
  const refMes = sel === 'total' ? mesDe(hoy) : sel, q = trimestre(refMes), yq = Number(refMes.slice(0, 4));
  const tq = totales(x => Number(x.slice(0, 4)) === yq && trimestre(mesDe(x)) === q);
  const pE = t.limpio ? Math.round(t.elfo / t.limpio * 100) : 50;
  const nom = sel === 'total' ? null : D.nominas[sel], fac = sel === 'total' ? null : (D.facturas[sel] || {});
  let nomBox = '';
  if (sel !== 'total' && t.elfo) {
    if (nom == null) nomBox = `<div class="box" style="background:var(--elfo2);color:#08523F"><span>Nómina de ${nomMes(sel)}: sin apuntar</span><button class="btn" style="background:var(--elfo)" data-a="nomina">Apuntar nómina</button></div>`;
    else {
      const dif = Math.round((nom - t.elfo) * 100) / 100;
      const txt = Math.abs(dif) < 1 ? 'Cuadra ✓' : dif < 0 ? 'Te faltan ' + eur(-dif, 1) : 'Te han pagado ' + eur(dif, 1) + ' de más';
      nomBox = `<div class="box" style="background:${Math.abs(dif) < 1 ? 'var(--elfo2)' : 'var(--warn)'};color:${Math.abs(dif) < 1 ? '#08523F' : 'var(--warnT)'}"><span>Nómina: ${eur(nom, 1)} · <b>${txt}</b></span><button class="btn" style="background:var(--elfo)" data-a="nomina">Cambiar</button></div>`;
    }
  }
  const ivaTxt = a.iva || t.iva ? `IVA ${a.iva} % / IRPF ${a.irpf} %` : `IRPF ${a.irpf} %`;
  return `
  <div class="row"><h1>Cuentas</h1></div>
  <div class="seg" role="tablist">${meses.map(m => `<button class="${sel === m ? 'on' : ''}" data-a="verMes" data-v="${m}">${MESC[Number(m.slice(5)) - 1][0].toUpperCase() + MESC[Number(m.slice(5)) - 1].slice(1)}</button>`).join('')}<button class="${sel === 'total' ? 'on' : ''}" data-a="verMes" data-v="total">Total</button></div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="rowb"><span style="font-size:14px;color:var(--mut)">Te queda limpio ${sel === 'total' ? 'en total' : 'en ' + nomMes(sel)}</span><span class="huge">${eur(t.limpio)}</span></div>
    <div class="bar" aria-hidden="true">${t.limpio ? `<div style="width:${pE}%;background:var(--elfo)"></div><div style="flex:1;background:var(--mago)"></div>` : ''}</div>
  </div>
  <section class="card" style="gap:6px">
    <span class="disp" style="font-size:18px;font-weight:700;color:var(--elfo)">Elfo</span>
    <div class="li"><span>${t.turnosE} turnos en ${t.diasE} día${t.diasE === 1 ? '' : 's'}</span><span>${eur(t.elfo)}</span></div>
    ${t.pn ? `<div class="li"><span>De Papá Noel</span><span style="color:var(--pn);font-weight:600">${t.pn} día${t.pn === 1 ? '' : 's'}</span></div>` : ''}
    <div class="li b2"><span>Neto que deberías cobrar</span><span>${eur(t.elfo)}</span></div>
    ${nomBox}
  </section>
  <section class="card" style="gap:6px">
    <span class="disp" style="font-size:18px;font-weight:700;color:var(--mago)">Mago</span>
    <div class="li"><span>${t.n} turno${t.n === 1 ? '' : 's'} (con IVA)</span><span>${eur(t.conIva)}</span></div>
    <div class="li"><span>${ivaTxt}</span><span>${eur(t.iva)} / −${eur(t.irpf)}</span></div>
    <div class="li"><span>Total de la factura</span><span>${eur(t.ingreso, 1)}</span></div>
    <div class="li b2"><span>Tuyo (sin el IVA)</span><span>${eur(t.tuyo)}</span></div>
    ${sel !== 'total' && t.n ? `
    <details style="font-size:13px;color:var(--mut)"><summary style="min-height:32px;display:flex;align-items:center;cursor:pointer">Datos para la factura</summary>
      <div style="display:flex;flex-direction:column;gap:3px;padding:4px 0 6px">
        ${t.diasM.map(([k, n]) => `<div class="li" style="font-size:13px"><span>${deClave(k).getDate()} ${MESC[deClave(k).getMonth()]}</span><span>${n} turno${n > 1 ? 's' : ''}</span></div>`).join('')}
        <div class="li" style="font-size:13px"><span>Base imponible</span><span>${eur(t.base, 1)}</span></div>
        <div class="li" style="font-size:13px"><span>IVA ${a.iva} %</span><span>${eur(t.iva, 1)}</span></div>
        <div class="li" style="font-size:13px"><span>Retención IRPF ${a.irpf} %</span><span>−${eur(t.irpf, 1)}</span></div>
        <div class="li" style="font-size:13px;font-weight:700"><span style="color:var(--ink)">Total a cobrar</span><span>${eur(t.ingreso, 1)}</span></div>
      </div></details>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:6px">
      <label class="chk" style="background:var(--mago2);color:#45259E"><input type="checkbox" data-a="fac" data-v="hecha" ${fac.hecha ? 'checked' : ''} style="accent-color:var(--mago)">Factura hecha</label>
      <label class="chk" style="background:var(--mago2);color:#45259E"><input type="checkbox" data-a="fac" data-v="cobrada" ${fac.cobrada ? 'checked' : ''} style="accent-color:var(--mago)">Cobrada</label>
    </div>` : ''}
  </section>
  ${tq.iva ? `<section style="background:var(--warn);border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:2px">
    <div class="rowb" style="font-size:14px;font-weight:700;color:#6E2F05"><span>IVA para apartar (${q}.º trimestre)</span><span>${eur(tq.iva, 1)}</span></div>
    <span style="font-size:13px;color:var(--warnT)">No es tuyo: se paga a Hacienda con el modelo 303, hasta el ${plazoIVA(yq, q)}.</span></section>` : ''}
  ${D.hoja ? `<div class="grid" style="grid-template-columns:1fr 1fr">
    <a class="wbtn" style="background:var(--ink);color:#fff" href="${esc(D.hoja)}" target="_blank" rel="noopener">Abrir la hoja</a>
    <a class="wbtn" style="border:1.5px solid var(--ink);color:var(--ink)" href="${esc(D.hoja.replace(/\/edit.*$/, '') + '/export?format=xlsx')}" target="_blank" rel="noopener">Descargar Excel</a></div>` : ''}
  ${estadoHTML()}`;
}

/* ---- Ajustes ---- */
function pAju() {
  const a = A();
  const pills = (key, vals, suf) => `<div class="pills">${vals.map(v => `<button class="${a[key] === v ? 'on' : ''}" data-a="aj" data-k="${key}" data-v="${v}">${v ? v + suf : 'Sin'}</button>`).join('')}</div>`;
  const avisoOK = typeof Notification !== 'undefined' && Notification.permission === 'granted' && LS.get('aviso', null);
  const c1 = calc({ m: 1, p: a });
  return `
  <button class="back" data-a="ir" data-v="hoy">${IC.izq}Hoy</button>
  <h1 style="font-size:30px">Ajustes</h1>
  <div class="sec" style="color:var(--elfo)">ELFO · PRECIOS NETOS</div>
  <div class="form">
    <div class="f"><label for="e2">Día de 2 turnos (€)</label><input id="e2" type="number" inputmode="decimal" value="${a.e2}" data-a="ajn" data-k="e2"></div>
    <div class="f"><label for="e4">Día de 4 turnos (€)</label><input id="e4" type="number" inputmode="decimal" value="${a.e4}" data-a="ajn" data-k="e4"></div>
  </div>
  <div class="sec" style="color:var(--mago)">MAGO</div>
  <div class="form">
    <div class="f"><label for="mp">Precio por turno (€)</label><input id="mp" type="number" inputmode="decimal" value="${a.mp}" data-a="ajn" data-k="mp"></div>
    <label class="f">El precio ya lleva el IVA<span class="sw mg"><input type="checkbox" data-a="ajb" data-k="inc" ${a.inc ? 'checked' : ''}><span></span></span></label>
    <div class="f"><span>IVA</span>${pills('iva', [0, 10, 21], ' %')}</div>
    <div class="f"><span>Retención IRPF</span>${pills('irpf', [0, 7, 15], ' %')}</div>
  </div>
  <section style="background:var(--mago2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:13px">
    <span style="font-weight:700;color:#45259E">Así queda un turno de mago</span>
    <div class="li" style="font-size:13px"><span>Precio sin IVA</span><span>${eur(c1.base, 1)}</span></div>
    <div class="li" style="font-size:13px"><span>IVA ${a.iva} % (para Hacienda)</span><span>${eur(c1.iva, 1)}</span></div>
    <div class="li" style="font-size:13px"><span>IRPF ${a.irpf} %</span><span>−${eur(c1.irpf, 1)}</span></div>
    <div class="li b2" style="font-size:13px"><span>Te ingresan</span><span>${eur(c1.ingreso, 1)}</span></div>
  </section>
  <p class="note">Si cambias un precio, cuenta para lo que apuntes desde ahora. Los días ya apuntados no cambian.</p>
  <div class="sec">AVISO</div>
  <div class="form">
    <label class="f">Avisarme si no he apuntado el día<span class="sw ok"><input type="checkbox" data-a="ajb" data-k="aviso" ${a.aviso ? 'checked' : ''}><span></span></span></label>
    <div class="f"><label for="hora">A qué hora</label><select id="hora" data-a="ajs" data-k="hora">${[20, 21, 22, 23].map(h => `<option value="${h}" ${a.hora === h ? 'selected' : ''}>${h}:00</option>`).join('')}</select></div>
    <div class="f"><span>${avisoOK ? 'Avisos activados en este móvil' : 'Este móvil todavía no recibe avisos'}</span><button class="btn" style="background:var(--ink)" data-a="activarAvisos">${avisoOK ? 'Probar' : 'Activar'}</button></div>
  </div>
  <div class="sec">HOJA DE GOOGLE</div>
  <div class="form">
    ${PIN ? `<div class="f"><span>Conectada</span><button class="btn" style="background:#8A8A92" data-a="desconectar">Cambiar código</button></div>`
      : `<div class="f"><label for="pin">Código de la hoja</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="000000"></div>
         <div class="f"><span style="color:var(--mut);font-size:13px">Está en la hoja, menú Turnos</span><button class="btn" style="background:var(--elfo)" data-a="conectar">Conectar</button></div>`}
    ${D.hoja ? `<div class="f"><span>Tu Excel</span><a href="${esc(D.hoja)}" target="_blank" rel="noopener" style="font-weight:700;color:var(--elfo)">Abrir la hoja</a></div>` : ''}
  </div>
  ${estadoHTML()}
  <p class="note">Turnos · versión 1.0</p>`;
}

function pModal() {
  if (S.modal === 'nomina') {
    const v = D.nominas[S.mes] != null ? D.nominas[S.mes] : '';
    return `<div class="modal" data-a="cerrarModal"><div class="in" data-stop>
      <h2 class="disp" style="margin:0;font-size:22px">Nómina de ${nomMes(S.mes)}</h2>
      <p class="note" style="margin:0">Pon lo que te han ingresado (el líquido de la nómina).</p>
      <input id="vnom" type="number" inputmode="decimal" step="0.01" value="${v}" aria-label="Importe de la nómina en euros" placeholder="0,00">
      <button class="prim" data-a="guardarNomina">Guardar</button>
      ${v !== '' ? '<button class="del" data-a="borrarNomina">Quitar la nómina</button>' : ''}
      <button class="del" style="color:var(--mut)" data-a="cerrarModal">Cancelar</button></div></div>`;
  }
  return '';
}

/* ---------- Toques ---------- */
let toastT;
function toast(t) { let e = $('.toast'); if (!e) { e = document.createElement('div'); e.className = 'toast'; e.setAttribute('role', 'status'); document.body.appendChild(e); } e.textContent = t; clearTimeout(toastT); toastT = setTimeout(() => e.remove(), 2600); }
function vib() { try { navigator.vibrate && navigator.vibrate(10); } catch (e) {} }
function guardarAjuste(k, v) { D.ajustes = Object.assign({}, A(), { [k]: v }); op({ t: 'ajustes', d: D.ajustes }); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return; // los gestiona 'change'
  if (el.dataset.a === 'cerrarModal' && e.target.closest('[data-stop]') && el.classList.contains('modal')) return;
  const a = el.dataset.a, v = el.dataset.v, k = hoyK();
  if (a === 'ir') { S.pant = v; if (v === 'cal' && !S.mesCal) S.mesCal = mesDe(hoyK()); pintar(); }
  else if (a === 'e') { const n = Number(v), d = D.dias[k]; setDia(k, { e: n, pn: n && d ? d.pn : false }, true); vib(); S.mantener = true; pintar(); }
  else if (a === 'm') { setDia(k, { m: Number(v) }, true); vib(); S.mantener = true; pintar(); }
  else if (a === 'deshacer') { S.mantener = true; deshacer(); }
  else if (a === 'abrirDia') { S.dia = v; const d = D.dias[v]; S.borr = d ? { e: d.e, pn: d.pn, m: d.m, nota: d.nota || '' } : { e: null, pn: false, m: null, nota: '' }; S.pant = 'dia'; pintar(); }
  else if (a === 'be') { S.borr.e = Number(v); if (!S.borr.e) S.borr.pn = false; S.mantener = true; pintar(); }
  else if (a === 'bm') { S.borr.m = Number(v); S.mantener = true; pintar(); }
  else if (a === 'guardarDia') {
    const b = S.borr;
    if (b.e == null && b.m == null && !b.nota) { toast('Elige algo para elfo o mago'); return; }
    setDia(S.dia, { e: b.e == null ? null : b.e, pn: !!b.pn, m: b.m == null ? null : b.m, nota: b.nota }, false);
    toast('Guardado'); S.pant = 'cal'; S.mesCal = mesDe(S.dia); pintar();
  }
  else if (a === 'borrarDia') { if (confirm('¿Borrar lo apuntado el ' + largo(S.dia).toLowerCase() + '?')) { borrarDia(S.dia); toast('Día borrado'); S.pant = 'cal'; pintar(); } }
  else if (a === 'mesCal') { const [y, m] = (S.mesCal || mesDe(k)).split('-').map(Number); const d = new Date(y, m - 1 + Number(v), 1); S.mesCal = d.getFullYear() + '-' + pad(d.getMonth() + 1); pintar(); }
  else if (a === 'verMes') { S.mes = v; S.pant = 'cue'; pintar(); }
  else if (a === 'nomina') { S.modal = 'nomina'; S.mantener = true; pintar(); }
  else if (a === 'cerrarModal') { S.modal = null; S.mantener = true; pintar(); }
  else if (a === 'guardarNomina') { const x = parseFloat(String($('#vnom').value).replace(',', '.')); if (isNaN(x)) { toast('Escribe el importe'); return; } D.nominas[S.mes] = x; S.modal = null; S.mantener = true; op({ t: 'nomina', mes: S.mes, v: x }); pintar(); }
  else if (a === 'borrarNomina') { delete D.nominas[S.mes]; S.modal = null; S.mantener = true; op({ t: 'nomina', mes: S.mes, v: null }); pintar(); }
  else if (a === 'aj') { guardarAjuste(el.dataset.k, Number(v)); S.mantener = true; pintar(); }
  else if (a === 'conectar') { const p = ($('#pin').value || '').trim(); if (!p) { toast('Escribe el código'); return; } PIN = p; LS.set('pin', p); S.sync = 'off'; toast('Conectando…'); sincronizar(); }
  else if (a === 'desconectar') { if (confirm('¿Quitar el código? Tus datos siguen en la hoja.')) { PIN = ''; LS.set('pin', ''); S.mantener = true; pintar(); } }
  else if (a === 'activarAvisos') activarAvisos();
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.a; if (!a) return;
  const k = hoyK();
  if (a === 'pn') { setDia(k, { pn: el.checked }, true); vib(); S.mantener = true; pintar(); }
  else if (a === 'bpn') { S.borr.pn = el.checked; }
  else if (a === 'bnota') { S.borr.nota = el.value.trim(); }
  else if (a === 'fac') { const m = S.mes && S.mes !== 'total' ? S.mes : mesDe(k); const f = Object.assign({}, D.facturas[m] || {}, { [el.dataset.v]: el.checked }); D.facturas[m] = f; op({ t: 'factura', mes: m, d: f }); S.mantener = true; pintar(); }
  else if (a === 'ajn') { const x = parseFloat(String(el.value).replace(',', '.')); if (isNaN(x) || x < 0) { toast('Número no válido'); S.mantener = true; pintar(); return; } guardarAjuste(el.dataset.k, x); S.mantener = true; pintar(); }
  else if (a === 'ajb') { guardarAjuste(el.dataset.k, el.checked); S.mantener = true; pintar(); }
  else if (a === 'ajs') { guardarAjuste(el.dataset.k, Number(el.value)); }
});
document.addEventListener('input', e => { if (e.target.dataset.a === 'bnota') S.borr.nota = e.target.value; });

/* ---------- Avisos al móvil ---------- */
let fbApp = null;
async function messaging() {
  const F = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-app.js');
  const M = await import('https://www.gstatic.com/firebasejs/' + FB_VER + '/firebase-messaging.js');
  if (!fbApp) fbApp = F.getApps().find(x => x.name === 'turnos') || F.initializeApp(FB_CONFIG, 'turnos');
  return { M, msg: M.getMessaging(fbApp) };
}
async function activarAvisos() {
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) { toast(standalone ? 'Este móvil no admite avisos (hace falta iOS 16.4 o más nuevo)' : 'Abre Turnos desde el icono de la pantalla de inicio para activar los avisos'); return; }
  if (!PIN) { toast('Primero conecta la hoja (abajo)'); return; }
  const per = await Notification.requestPermission();
  if (per !== 'granted') { toast('Sin permiso: actívalo en Ajustes del iPhone › Notificaciones › Turnos'); return; }
  try {
    toast('Activando…');
    const { M, msg } = await messaging();
    const reg = await navigator.serviceWorker.ready;
    let token = null, ultimo = null;
    for (let i = 0; i < 3 && !token; i++) {
      try { token = await M.getToken(msg, { vapidKey: VAPID, serviceWorkerRegistration: reg }); }
      catch (e) { ultimo = e; await new Promise(r => setTimeout(r, 1500)); }
    }
    if (!token) throw ultimo || new Error('sin token');
    LS.set('aviso', token);
    op({ t: 'aviso', token, prueba: true });
    toast('Avisos activados: te llegará uno de prueba');
    S.mantener = true; pintar();
  } catch (e) { toast('No se han podido activar: ' + ((e && (e.code || e.message)) || e)); }
}
async function revisarAviso() {
  const viejo = LS.get('aviso', null);
  if (!viejo || !PIN || typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try {
    const { M, msg } = await messaging();
    const reg = await navigator.serviceWorker.ready;
    const token = await M.getToken(msg, { vapidKey: VAPID, serviceWorkerRegistration: reg });
    if (token && token !== viejo) { LS.set('aviso', token); op({ t: 'aviso', token, viejo }); }
  } catch (e) {}
}

/* ---------- Arranque ---------- */
(function () {
  if (location.hash === '#cal') S.pant = 'cal';
  pintar();
  sincronizar();
  setTimeout(revisarAviso, 4000);
  window.addEventListener('online', sincronizar);
  let ultimoDia = hoyK();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (hoyK() !== ultimoDia) { ultimoDia = hoyK(); S.ultimo = null; }
    if (!S.modal && S.pant !== 'dia' && document.activeElement.tagName !== 'INPUT') { S.mantener = true; pintar(); }
    sincronizar();
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const nueva = w => { w.postMessage('skipWaiting'); };
      if (reg.waiting && navigator.serviceWorker.controller) nueva(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) nueva(w); }); });
    }).catch(() => {});
    // Solo recarga cuando llega una versión nueva (no la primera vez que se instala).
    let recargado = false; const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (habia && !recargado && S.pant !== 'dia' && !S.modal) { recargado = true; location.reload(); } });
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.abrir) { S.pant = e.data.abrir; pintar(); } });
  }
})();
</script>
